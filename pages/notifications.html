<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Your notifications on Felcin." />
  <meta name="theme-color" content="#0b7a75" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <link rel="manifest" href="/manifest.json" />
  <title>Notifications — Felcin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/felcin-redesign.css?v=20260507-v9" />
  <link rel="stylesheet" href="/static/felcin-dark.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}
    .rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:24px 14px;gap:6px;overflow-y:auto;border-right:1px solid var(--border);border-radius:0 !important;}
    .brand{display:flex;align-items:center;gap:10px;padding:8px 14px 24px;text-decoration:none;}
    .brand img{width:32px;height:32px;}
    nav{display:flex;flex-direction:column;gap:2px;flex:1;}
    .main-area{max-width:640px;width:100%;margin:0 auto;padding:0 16px;}
    .head{padding:20px 4px;display:flex;align-items:center;justify-content:space-between;border:none !important;box-shadow:none !important;background:transparent !important;border-radius:0 !important;}
    .head h1{font-size:22px;font-weight:700;}
    .mark{font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent !important;color:var(--primary) !important;padding:8px 12px !important;}
    .section-label{font-size:14px;font-weight:700;color:var(--text);padding:12px 16px 8px;}
    .item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border-light);cursor:pointer;transition:background .15s;border-radius:0 !important;box-shadow:none !important;}
    .item:hover{background:var(--bg-hover) !important;}
    .item.unread{background:rgba(11,122,117,0.04) !important;border-left:3px solid var(--primary) !important;}
    .item-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--bg);border:1px solid var(--border);flex-shrink:0;}
    .item-avatar-fallback{width:44px;height:44px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--muted);flex-shrink:0;}
    .item-body{flex:1;min-width:0;}
    .item-text{font-size:14px;color:var(--text);line-height:1.4;}
    .item-text strong{font-weight:600;}
    .item-time{font-size:12px;color:var(--muted);margin-top:2px;}
    .item-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--bg);flex-shrink:0;}
    .empty{text-align:center;padding:60px 20px;color:var(--muted);}
    .empty h2{font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px;}
    .loading{text-align:center;padding:40px;color:var(--muted);font-size:14px;}
    .mobile-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:80;padding:4px 0 calc(4px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(6,1fr);background:var(--bg-card);border-top:1px solid var(--border);}
    .mobile-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;text-decoration:none;color:var(--text);font-size:0;padding:6px;}
    @media(max-width:860px){
      body{display:block;padding-bottom:60px;}
      .rail{display:none;}
      .mobile-nav{display:grid;}
      .main-area{padding:0;max-width:100%;}
      .head{padding:12px 16px;position:sticky;top:0;z-index:50;background:var(--bg-card) !important;border-bottom:1px solid var(--border-light) !important;}
    }
  </style>
</head>
<body>
  <aside class="rail">
    <a href="/" class="brand"><img src="/static/logo-nav.png" alt="Felcin" width="32" height="32">Felcin</a>
    <nav>
      <a href="/" class="nav-link">Home</a>
      <a href="/explore" class="nav-link">Explore</a>
      <a href="/reels" class="nav-link">Reels</a>
      <a href="/stories" class="nav-link">Stories</a>
      <a href="/live" class="nav-link">Live</a>
      <a href="/private-chats" class="nav-link">Messages</a>
      <a href="/notifications" class="nav-link active">Notifications</a>
      <a href="/creator" class="nav-link">Create</a>
      <a href="/dashboard" class="nav-link">Dashboard</a>
    </nav>
  </aside>

  <div class="main-area">
    <div class="head">
      <h1>Notifications</h1>
      <button class="mark" id="mark-all-btn">Mark all read</button>
    </div>
    <div id="notif-list">
      <div class="loading">Loading notifications...</div>
    </div>
  </div>

  <nav class="mobile-nav">
    <a href="/"><span class="material-symbols-outlined" style="font-size:26px;">home</span></a>
    <a href="/explore"><span class="material-symbols-outlined" style="font-size:26px;">explore</span></a>
    <a href="/reels"><span class="material-symbols-outlined" style="font-size:26px;">play_circle</span></a>
    <a href="/creator"><span class="material-symbols-outlined" style="font-size:26px;">add_circle</span></a>
    <a href="/notifications" style="color:var(--primary);"><span class="material-symbols-outlined" style="font-size:26px;">notifications</span></a>
    <a href="/profile"><span class="material-symbols-outlined" style="font-size:26px;">person</span></a>
  </nav>

  <script defer src="/static/felcin-common.js?v=20260507-v11"></script>
  <script defer src="/static/felcin-realtime.js?v=20260417-1"></script>
  <script defer src="/static/felcin-push.js?v=20260420-2"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js"></script>
  <script>
    const firebaseConfig={apiKey:"AIzaSyCKmWO04sVRhxZv3EuK_j_53yup9K_LEeE",authDomain:"felcin.firebaseapp.com",projectId:"felcin",storageBucket:"felcin.firebasestorage.app",messagingSenderId:"989891719192",appId:"1:989891719192:web:1266786c201c87f4c8536d"};
    let db,currentUser;

    document.addEventListener("DOMContentLoaded",async ()=>{
      if(typeof firebase==="undefined")return;
      firebase.initializeApp(firebaseConfig);
      if(typeof initAppCheck==="function")initAppCheck();
      db=firebase.firestore();

      try{await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(e){}

      try{

        if(typeof firebase.auth().authStateReady==="function"){

          await firebase.auth().authStateReady();

        }else{

          await new Promise(resolve=>{const u=firebase.auth().onAuthStateChanged(()=>{u();resolve();});});

        }

      }catch(e){}

      const user=firebase.auth().currentUser;

      if(!user){window.location.href="/login";return;}

      if(!canAccessApp(user)){await firebase.auth().signOut().catch(()=>{});showVerificationNoticeAndRedirect();return;}

      currentUser=user;

      loadNotifications();

      document.getElementById("mark-all-btn").addEventListener("click",markAllRead);
    });

    async function loadNotifications(){
      const list=document.getElementById("notif-list");
      try{
        const snap=await db.collection("notifications").where("recipientId","==",currentUser.uid).orderBy("createdAt","desc").limit(50).get();
        if(snap.empty){
          list.innerHTML='<div class="empty"><h2>No notifications yet</h2><p>When someone likes, comments, or follows you, you\'ll see it here.</p></div>';
          return;
        }

        // Group: today, this week, earlier
        const now=Date.now();
        const today=[],week=[],earlier=[];
        snap.forEach(doc=>{
          const d={id:doc.id,...doc.data()};
          const t=d.createdAt?.toDate?d.createdAt.toDate().getTime():0;
          const diff=now-t;
          if(diff<86400000)today.push(d);
          else if(diff<604800000)week.push(d);
          else earlier.push(d);
        });

        list.innerHTML="";
        if(today.length){list.innerHTML+='<div class="section-label">Today</div>';today.forEach(n=>list.appendChild(renderNotif(n)));}
        if(week.length){list.innerHTML+='<div class="section-label">This week</div>';week.forEach(n=>list.appendChild(renderNotif(n)));}
        if(earlier.length){list.innerHTML+='<div class="section-label">Earlier</div>';earlier.forEach(n=>list.appendChild(renderNotif(n)));}
      }catch(err){
        console.error("Notifications error:",err);
        list.innerHTML='<div class="empty"><h2>Could not load notifications</h2></div>';
      }
    }

    function renderNotif(n){
      const el=document.createElement("div");
      el.className="item"+(n.read?"":" unread");
      const time=typeof getTimeString==="function"?getTimeString(n.createdAt):"";
      const senderName=esc(n.senderName||n.fromName||"Someone");
      let text="";
      const type=n.type||"";
      if(type==="like")text='<strong>'+senderName+'</strong> liked your post';
      else if(type==="comment")text='<strong>'+senderName+'</strong> commented on your post';
      else if(type==="follow")text='<strong>'+senderName+'</strong> started following you';
      else if(type==="mention")text='<strong>'+senderName+'</strong> mentioned you';
      else text='<strong>'+senderName+'</strong> '+(esc(n.message||n.body||"sent you a notification"));

      const initial=senderName.charAt(0).toUpperCase();
      const avatarHtml=n.senderPhoto?'<img class="item-avatar" src="'+esc(n.senderPhoto)+'" alt="">':'<div class="item-avatar-fallback">'+initial+'</div>';

      el.innerHTML=avatarHtml+'<div class="item-body"><div class="item-text">'+text+'</div><div class="item-time">'+esc(time)+'</div></div>';

      el.addEventListener("click",async()=>{
        if(!n.read){try{await db.collection("notifications").doc(n.id).update({read:true});}catch(e){}}
        el.classList.remove("unread");
        if(n.postId)window.location.href="/comments?postId="+n.postId;
        else if(n.senderId||n.fromId)window.location.href="/profile?uid="+(n.senderId||n.fromId);
      });
      return el;
    }

    async function markAllRead(){
      try{
        const snap=await db.collection("notifications").where("recipientId","==",currentUser.uid).where("read","==",false).get();
        const batch=db.batch();
        snap.forEach(doc=>batch.update(doc.ref,{read:true}));
        await batch.commit();
        document.querySelectorAll(".item.unread").forEach(el=>el.classList.remove("unread"));
      }catch(e){console.error("Mark all read error:",e);}
    }

    function esc(t){const d=document.createElement("div");d.textContent=String(t||"");return d.innerHTML;}
  </script>
</body>
</html>
