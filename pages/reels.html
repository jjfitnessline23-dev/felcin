  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overflow:hidden;background:#000;}

    /* Sidebar */
    #reels-sidebar{position:fixed;top:0;left:0;bottom:0;width:240px;background:#fff;border-right:1px solid #e2e8f0;display:none;flex-direction:column;z-index:30;overflow-y:auto;}
    @media(min-width:1024px){#reels-sidebar{display:flex;}}

    /* Reels outer container */
    #reels-outer{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;}
    @media(min-width:1024px){#reels-outer{left:240px;}}

    /* Reels header (mobile) */
    #reels-header{position:absolute;top:0;left:0;right:0;z-index:20;padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,0.55) 0%,transparent 100%);}
    .reels-title{font-size:20px;font-weight:800;color:#fff;font-family:Sora,sans-serif;letter-spacing:-.01em;}

    /* Feed */
    #reels-feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;}
    #reels-feed::-webkit-scrollbar{display:none;}

    /* Each reel */
    .reel-item{height:100vh;height:100svh;scroll-snap-align:start;position:relative;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;}
    @media(min-width:1024px){.reel-item{max-height:100vh;max-height:100svh;}}

    /* Video */
    .reel-video{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;}
    @media(min-width:1024px){
      #reels-feed{display:flex;flex-direction:column;align-items:center;}
      .reel-item{width:100%;max-width:420px;}
    }

    /* Gradient overlays */
    .reel-grad-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(to bottom,rgba(0,0,0,0.5),transparent);pointer-events:none;}
    .reel-grad-bottom{position:absolute;bottom:0;left:0;right:0;height:260px;background:linear-gradient(to top,rgba(0,0,0,0.75),transparent);pointer-events:none;}

    /* Bottom info */
    .reel-info{position:absolute;bottom:0;left:0;right:72px;padding:16px 16px 28px;}
    @media(max-width:600px){.reel-info{bottom:60px;padding-bottom:16px;}}
    .reel-user{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
    .reel-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.7);flex-shrink:0;background:#334155;}
    .reel-avatar-init{width:38px;height:38px;border-radius:50%;background:#0f766e;border:2px solid rgba(255,255,255,0.7);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex-shrink:0;}
    .reel-username{font-size:14px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.4);}
    .reel-follow-btn{margin-left:6px;font-size:12px;font-weight:700;color:#fff;border:1.5px solid rgba(255,255,255,0.8);border-radius:6px;padding:3px 10px;background:transparent;cursor:pointer;transition:background .15s;}
    .reel-follow-btn:hover{background:rgba(255,255,255,0.15);}
    .reel-caption{font-size:13px;color:#fff;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,0.5);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;}
    .reel-caption.expanded{-webkit-line-clamp:unset;}
    .reel-more{color:rgba(255,255,255,0.7);font-size:12px;font-weight:600;cursor:pointer;margin-top:3px;display:inline-block;}

    /* Right controls */
    .reel-controls{position:absolute;right:10px;bottom:28px;display:flex;flex-direction:column;align-items:center;gap:22px;}
    @media(max-width:600px){.reel-controls{bottom:80px;}}
    .reel-btn{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;color:#fff;padding:0;}
    .reel-btn-icon{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.15);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;transition:background .15s;}
    .reel-btn:hover .reel-btn-icon,.reel-btn:active .reel-btn-icon{background:rgba(255,255,255,0.25);}
    .reel-btn .material-symbols-outlined{font-size:24px;color:#fff;}
    .reel-btn.liked .reel-btn-icon{background:rgba(239,68,68,0.3);}
    .reel-btn.liked .material-symbols-outlined{color:#ef4444;}
    .reel-btn-label{font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.5);}

    /* Mute button (top right) */
    #global-mute-btn{position:absolute;top:14px;right:14px;z-index:25;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.45);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    #global-mute-btn .material-symbols-outlined{font-size:20px;color:#fff;}

    /* Play/pause indicator */
    .play-indicator{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s;}
    .play-indicator.show{opacity:1;animation:fadeind .5s forwards;}
    @keyframes fadeind{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
    .play-indicator-inner{width:70px;height:70px;border-radius:50%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;}
    .play-indicator-inner .material-symbols-outlined{font-size:38px;color:#fff;}

    /* Loading / empty states */
    #reels-loading{height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px;scroll-snap-align:start;}
    #reels-empty{height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:12px;text-align:center;padding:32px;scroll-snap-align:start;}
    .spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Sidebar nav styles */
    .reel-nav-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-size:15px;font-weight:600;color:#475569;text-decoration:none;transition:background .15s,color .15s;}
    .reel-nav-link:hover{background:#f8fafc;color:#0f766e;}
    .reel-nav-link.active{background:#f0fdfa;color:#0f766e;}
  </style>

  <script>
    const firebaseConfig={apiKey:"AIzaSyCKmWO04sVRhxZv3EuK_j_53yup9K_LEeE",authDomain:"felcin.firebaseapp.com",projectId:"felcin",storageBucket:"felcin.firebasestorage.app",messagingSenderId:"989891719192",appId:"1:989891719192:web:1266786c201c87f4c8536d"};
    let db,currentUser,globalMuted=true,lastQuery=null,loadingMore=false,allLoaded=false;

    document.addEventListener("DOMContentLoaded",async()=>{
      if(typeof firebase==="undefined")return;
      firebase.initializeApp(firebaseConfig);
      if(typeof initAppCheck==="function")initAppCheck();
      db=firebase.firestore();
      try{await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(e){}
      try{
        if(typeof firebase.auth().authStateReady==="function"){await firebase.auth().authStateReady();}
        else{await new Promise(r=>{const u=firebase.auth().onAuthStateChanged(()=>{u();r();});});}
      }catch(e){}
      const user=firebase.auth().currentUser;
      if(!user){window.location.href="/login";return;}
      if(!canAccessApp(user)){await firebase.auth().signOut().catch(()=>{});showVerificationNoticeAndRedirect();return;}
      currentUser=user;
      const name=user.displayName||user.email||"?";
      document.getElementById("nav-name").textContent=name;
      document.getElementById("nav-avatar").textContent=name.charAt(0).toUpperCase();
      if(user.photoURL)document.getElementById("nav-avatar").outerHTML='<img src="'+esc(user.photoURL)+'" style="width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;">';
      loadReels();
    });

    function esc(t){const d=document.createElement("div");d.textContent=String(t||"");return d.innerHTML;}
    function toggleGlobalMute(){
      globalMuted=!globalMuted;
      document.getElementById("mute-icon").textContent=globalMuted?"volume_off":"volume_up";
      document.querySelectorAll(".reel-video").forEach(v=>{v.muted=globalMuted;});
    }

    async function loadReels(){
      try{
        let q=db.collection("posts").orderBy("createdAt","desc").limit(30);
        const snap=await q.get();
        lastQuery=snap;
        const allPosts=snap.docs.map(d=>({id:d.id,...d.data()}));
        // Filter for video posts
        const reels=allPosts.filter(p=>{
          if(!p.mediaUrl)return false;
          if(typeof resolveMediaType==="function"){
            return resolveMediaType(p.contentType,p.mimeType,p.mediaUrl)==="video";
          }
          // Fallback: check URL extension or contentType field
          const url=(p.mediaUrl||"").toLowerCase();
          const ct=(p.contentType||p.mimeType||"").toLowerCase();
          return ct.startsWith("video")||/\.(mp4|mov|webm|ogg|avi|m4v)(\?|$)/.test(url);
        });
        if(!reels.length){
          document.getElementById("reels-feed").innerHTML='<div id="reels-empty"><span class="material-symbols-outlined" style="font-size:56px;opacity:.4;">play_circle</span><h2 style="font-size:20px;font-weight:800;">No reels yet</h2><p style="font-size:14px;opacity:.6;">Videos posted by people you follow will appear here.</p><a href="/creator" style="margin-top:12px;padding:10px 22px;background:#0f766e;color:#fff;border-radius:10px;font-weight:700;font-size:14px;text-decoration:none;">Create a reel</a></div>';
          return;
        }
        // Fetch author profiles in batches of 5
        const authorIds=[...new Set(reels.map(r=>r.authorId).filter(Boolean))];
        const profiles={};
        for(let i=0;i<authorIds.length;i+=5){
          const chunk=authorIds.slice(i,i+5);
          await Promise.all(chunk.map(async uid=>{
            try{
              const s=await db.collection("users").doc(uid).collection("public").doc("profile").get();
              profiles[uid]=s.exists?s.data():{displayName:"User",photoURL:"",photoFocusY:50};
            }catch(e){profiles[uid]={displayName:"User",photoURL:"",photoFocusY:50};}
          }));
        }
        document.getElementById("reels-feed").innerHTML="";
        reels.forEach(reel=>renderReel(reel,profiles[reel.authorId]||{displayName:"User",photoURL:""}));
        setupObserver();
        // Infinite scroll listener
        document.getElementById("reels-feed").addEventListener("scroll",onFeedScroll,{passive:true});
      }catch(err){
        console.error(err);
        document.getElementById("reels-feed").innerHTML='<div id="reels-empty"><span class="material-symbols-outlined" style="font-size:56px;opacity:.4;">error</span><p style="font-size:14px;opacity:.6;">Could not load reels. Pull down to retry.</p></div>';
      }
    }

    function renderReel(reel,profile){
      const feed=document.getElementById("reels-feed");
      const name=profile.displayName||"User";
      const initial=name.charAt(0).toUpperCase();
      const avatarHtml=profile.photoURL
        ?'<img class="reel-avatar" src="'+esc(profile.photoURL)+'" alt="">'
        :'<div class="reel-avatar-init">'+esc(initial)+'</div>';
      const caption=reel.caption||reel.text||"";
      const likes=reel.likes||0;
      const comments=reel.comments||0;
      const isOwn=reel.authorId===currentUser.uid;

      const el=document.createElement("div");
      el.className="reel-item";
      el.dataset.postId=reel.id;
      el.dataset.authorId=reel.authorId||"";
      el.dataset.liked="false";
      el.dataset.likes=likes;
      el.innerHTML=`
        <video class="reel-video" data-src="${esc(reel.mediaUrl)}" loop muted playsinline preload="none"></video>
        <div class="reel-grad-top"></div>
        <div class="reel-grad-bottom"></div>
        <div class="play-indicator" id="pi-${esc(reel.id)}"><div class="play-indicator-inner"><span class="material-symbols-outlined">play_arrow</span></div></div>
        <div class="reel-info">
          <div class="reel-user">
            <a href="/profile?uid=${esc(reel.authorId||"")}" style="text-decoration:none;display:flex;align-items:center;gap:9px;">
              ${avatarHtml}
              <span class="reel-username">${esc(name)}</span>
            </a>
            ${!isOwn?'<button class="reel-follow-btn" onclick="followUser(this,\''+esc(reel.authorId||"")+'\')">Follow</button>':""}
          </div>
          ${caption?`<div class="reel-caption" id="cap-${esc(reel.id)}">${esc(caption)}</div>${caption.length>80?'<span class="reel-more" onclick="expandCaption(\''+esc(reel.id)+'\')">more</span>':""}`:""}
        </div>
        <div class="reel-controls">
          <button class="reel-btn" id="like-btn-${esc(reel.id)}" onclick="toggleLike(this,'${esc(reel.id)}')" title="Like">
            <div class="reel-btn-icon"><span class="material-symbols-outlined">favorite_border</span></div>
            <span class="reel-btn-label" id="like-count-${esc(reel.id)}">${likes}</span>
          </button>
          <button class="reel-btn" onclick="location.href='/comments?postId=${esc(reel.id)}'" title="Comment">
            <div class="reel-btn-icon"><span class="material-symbols-outlined">chat_bubble_outline</span></div>
            <span class="reel-btn-label">${comments}</span>
          </button>
          <button class="reel-btn" onclick="shareReel('${esc(reel.id)}')" title="Share">
            <div class="reel-btn-icon"><span class="material-symbols-outlined">send</span></div>
            <span class="reel-btn-label">Share</span>
          </button>
        </div>`;

      // Tap video to play/pause
      el.querySelector(".reel-video").addEventListener("click",function(){
        const v=this;
        const pi=document.getElementById("pi-"+reel.id);
        if(v.paused){v.play().catch(()=>{});if(pi){pi.querySelector(".material-symbols-outlined").textContent="play_arrow";}}
        else{v.pause();if(pi){pi.querySelector(".material-symbols-outlined").textContent="pause";pi.classList.add("show");setTimeout(()=>pi.classList.remove("show"),600);}}
      });
      feed.appendChild(el);
    }

    function setupObserver(){
      if(!("IntersectionObserver" in window))return;
      const obs=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
          const item=entry.target;
          const video=item.querySelector(".reel-video");
          if(!video)return;
          if(entry.isIntersecting&&entry.intersectionRatio>=0.6){
            if(!video.src&&video.dataset.src){video.src=video.dataset.src;}
            video.muted=globalMuted;
            video.play().catch(()=>{});
            // Lazy-load like state for visible reel
            checkLikeState(item.dataset.postId,item);
          }else{
            video.pause();
            video.currentTime=0;
          }
        });
      },{threshold:0.6});
      document.querySelectorAll(".reel-item").forEach(el=>obs.observe(el));
    }

    async function checkLikeState(postId,item){
      if(!postId||!currentUser||item.dataset.likeChecked)return;
      item.dataset.likeChecked="1";
      try{
        const snap=await db.collection("posts").doc(postId).collection("likes").doc(currentUser.uid).get();
        if(snap.exists){
          item.dataset.liked="true";
          const btn=document.getElementById("like-btn-"+postId);
          if(btn){btn.classList.add("liked");btn.querySelector(".material-symbols-outlined").textContent="favorite";}
        }
      }catch(e){}
    }

    async function toggleLike(btn,postId){
      const item=btn.closest(".reel-item");
      const isLiked=item.dataset.liked==="true";
      const countEl=document.getElementById("like-count-"+postId);
      let count=parseInt(item.dataset.likes)||0;
      if(isLiked){
        item.dataset.liked="false";
        btn.classList.remove("liked");
        btn.querySelector(".material-symbols-outlined").textContent="favorite_border";
        count=Math.max(0,count-1);
      }else{
        item.dataset.liked="true";
        btn.classList.add("liked");
        btn.querySelector(".material-symbols-outlined").textContent="favorite";
        count+=1;
        // Heart animation
        btn.querySelector(".reel-btn-icon").style.transform="scale(1.3)";
        setTimeout(()=>{btn.querySelector(".reel-btn-icon").style.transform="";},200);
      }
      item.dataset.likes=count;
      if(countEl)countEl.textContent=count;
      try{
        const likeRef=db.collection("posts").doc(postId).collection("likes").doc(currentUser.uid);
        if(!isLiked){
          await likeRef.set({uid:currentUser.uid,createdAt:new Date()});
          await db.collection("posts").doc(postId).update({likes:firebase.firestore.FieldValue.increment(1)}).catch(()=>{});
        }else{
          await likeRef.delete();
          await db.collection("posts").doc(postId).update({likes:firebase.firestore.FieldValue.increment(-1)}).catch(()=>{});
        }
      }catch(e){}
    }

    async function followUser(btn,uid){
      if(!uid||!currentUser)return;
      btn.disabled=true;
      try{
        const id=currentUser.uid+"_"+uid;
        await db.collection("follows").doc(id).set({followerId:currentUser.uid,followingId:uid,createdAt:new Date()});
        btn.textContent="Following";
        btn.style.opacity="0.6";
      }catch(e){btn.disabled=false;}
    }

    function expandCaption(postId){
      const el=document.getElementById("cap-"+postId);
      if(el)el.classList.add("expanded");
    }

    async function shareReel(postId){
      const url=location.origin+"/comments?postId="+postId;
      if(navigator.share){
        try{await navigator.share({title:"Check this reel on Felcin",url});}catch(e){}
      }else{
        try{await navigator.clipboard.writeText(url);}catch(e){}
        alert("Link copied!");
      }
    }

    function doSignOut(){if(typeof firebase!=="undefined"&&firebase.apps&&firebase.apps.length){firebase.auth().signOut().then(()=>{window.location.href="/login";}).catch(()=>{window.location.href="/login";});}else{window.location.href="/login";}}

    async function onFeedScroll(){
      if(loadingMore||allLoaded)return;
      const feed=document.getElementById("reels-feed");
      const nearEnd=feed.scrollHeight-feed.scrollTop-feed.clientHeight<feed.clientHeight*1.5;
      if(!nearEnd)return;
      loadingMore=true;
      try{
        if(!lastQuery||lastQuery.empty){allLoaded=true;return;}
        const lastDoc=lastQuery.docs[lastQuery.docs.length-1];
        const snap=await db.collection("posts").orderBy("createdAt","desc").startAfter(lastDoc).limit(20).get();
        lastQuery=snap;
        if(snap.empty){allLoaded=true;return;}
        const newPosts=snap.docs.map(d=>({id:d.id,...d.data()}));
        const reels=newPosts.filter(p=>{
          if(!p.mediaUrl)return false;
          if(typeof resolveMediaType==="function"){
            return resolveMediaType(p.contentType,p.mimeType,p.mediaUrl)==="video";
          }
          const url=(p.mediaUrl||"").toLowerCase();
          const ct=(p.contentType||p.mimeType||"").toLowerCase();
          return ct.startsWith("video")||/\.(mp4|mov|webm|ogg|avi|m4v)(\?|$)/.test(url);
        });
        if(!reels.length){loadingMore=false;return;}
        const authorIds=[...new Set(reels.map(r=>r.authorId).filter(Boolean))];
        const profiles={};
        await Promise.all(authorIds.map(async uid=>{
          try{
            const s=await db.collection("users").doc(uid).collection("public").doc("profile").get();
            profiles[uid]=s.exists?s.data():{displayName:"User",photoURL:""};
          }catch(e){profiles[uid]={displayName:"User",photoURL:""};}
        }));
        const beforeCount=feed.querySelectorAll(".reel-item").length;
        reels.forEach(reel=>renderReel(reel,profiles[reel.authorId]||{displayName:"User",photoURL:""}));
        // Re-observe new items
        const items=feed.querySelectorAll(".reel-item");
        if("IntersectionObserver" in window){
          const obs=new IntersectionObserver(entries=>{
            entries.forEach(entry=>{
              const item=entry.target;const video=item.querySelector(".reel-video");if(!video)return;
              if(entry.isIntersecting&&entry.intersectionRatio>=0.6){
                if(!video.src&&video.dataset.src){video.src=video.dataset.src;}
                video.muted=globalMuted;video.play().catch(()=>{});
                checkLikeState(item.dataset.postId,item);
              }else{video.pause();video.currentTime=0;}
            });
          },{threshold:0.6});
          for(let i=beforeCount;i<items.length;i++)obs.observe(items[i]);
        }
      }catch(e){console.error(e);}
      finally{loadingMore=false;}
    }
  </script>
