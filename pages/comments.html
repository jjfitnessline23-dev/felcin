<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="View post and comments on Felcin." />

  <meta name="theme-color" content="#0b7a75" />

  <link rel="icon" href="/favicon.ico" />

  <link rel="apple-touch-icon" href="/logo192.png" />

  <link rel="manifest" href="/manifest.json" />

  <title>Post — Felcin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet" />

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/felcin-redesign.css?v=20260507-v9" />

  <style>

    *{box-sizing:border-box;margin:0;padding:0;}

    body{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}

    .rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:24px 14px;gap:6px;overflow-y:auto;border-right:1px solid var(--border);border-radius:0 !important;}

    .brand{display:flex;align-items:center;gap:10px;padding:8px 14px 24px;text-decoration:none;}

    .brand img{width:32px;height:32px;}

    nav{display:flex;flex-direction:column;gap:2px;flex:1;}

    .main-area{max-width:680px;width:100%;padding:0 24px;margin:0 auto;}

    .head{padding:20px 4px 16px;border:none !important;box-shadow:none !important;background:transparent !important;border-radius:0 !important;display:flex;align-items:center;gap:12px;}

    .head h1{font-size:20px;font-weight:700;}

    .back-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:transparent;border:none;cursor:pointer;color:var(--text);font-size:18px;flex-shrink:0;}

    .back-btn:hover{background:var(--bg-hover);}

    .post-detail{margin-bottom:16px;}

    .post-header{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;}

    .post-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--bg);border:1px solid var(--border);flex-shrink:0;}

    .post-avatar-fallback{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--border);flex-shrink:0;}

    .post-author{font-weight:600;font-size:14px;}

    .post-author a{color:var(--text);text-decoration:none;}

    .post-author a:hover{text-decoration:underline;}

    .post-time{font-size:12px;color:var(--muted);}

    .post-media{width:100%;border-top:1px solid var(--border-light);border-bottom:1px solid var(--border-light);max-height:220px;overflow:hidden;}

    .post-media img{width:100%;display:block;max-height:220px;object-fit:cover;}

    .post-media video{width:100%;display:block;max-height:220px;object-fit:cover;background:#000;}

    .post-body{padding:14px 16px;}

    .post-body .caption{font-size:15px;line-height:1.5;}

    .post-actions{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--border-light);}

    .post-actions button{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:transparent !important;border:none !important;font-size:13px;font-weight:600;color:var(--muted) !important;cursor:pointer;border-radius:var(--radius);}

    .post-actions button:hover{background:var(--bg-hover) !important;}

    .post-actions button.liked{color:var(--err) !important;}

    .post-stats{padding:4px 16px 8px;font-size:13px;color:var(--muted);}

    .comment-section{border-top:1px solid var(--border);padding-top:4px;}

    .comment-form{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border-light);}

    .comment-form input{flex:1;background:transparent;font-size:14px;border:1px solid var(--border) !important;border-radius:var(--radius,8px) !important;padding:10px 14px !important;outline:none;color:var(--text);}

    .comment-form input:focus{border-color:var(--primary) !important;}

    .comment-form button{padding:10px 18px !important;font-size:13px !important;font-weight:600 !important;background:var(--primary) !important;color:#fff !important;border:none !important;border-radius:var(--radius,8px) !important;cursor:pointer;}

    .comment-form button:hover{opacity:0.9;}

    .comment-form button:disabled{opacity:0.5;cursor:not-allowed;}

    .comment-error{display:none;margin:0 16px 10px;padding:8px 10px;border-radius:8px;background:rgba(204,58,58,0.08);border:1px solid rgba(204,58,58,0.3);color:var(--err);font-size:12px;font-weight:600;}

    .comment-list{max-height:none;}

    .comment-item{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;}

    .comment-item:not(:last-child){border-bottom:1px solid var(--border-light);}

    .c-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--bg);flex-shrink:0;border:1px solid var(--border);}

    .c-avatar-fallback{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);flex-shrink:0;border:1px solid var(--border);}

    .c-body{flex:1;min-width:0;}

    .c-body .c-name{font-weight:600;font-size:13px;}

    .c-body .c-name a{color:var(--text);text-decoration:none;}

    .c-body .c-text{font-size:14px;line-height:1.4;margin-top:2px;}

    .c-body .c-time{font-size:11px;color:var(--muted);margin-top:3px;}

    .empty{text-align:center;padding:40px;color:var(--muted);}

    .mobile-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:80;padding:4px 0 calc(4px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(6,1fr);background:var(--bg-card);border-top:1px solid var(--border);}

    .mobile-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;text-decoration:none;color:var(--text);font-size:0;padding:6px;}

    @media(max-width:860px){

      body{display:block;padding-bottom:60px;}

      .rail{display:none;}

      .mobile-nav{display:grid;}

      .main-area{padding:0;max-width:100%;}

      .head{padding:12px;position:sticky;top:0;z-index:50;background:var(--bg) !important;}

      .comment-form{align-items:stretch;gap:6px;padding:10px 12px;}

      .comment-form input{font-size:13px;padding:10px 12px !important;}

      .comment-form button{padding:10px 12px !important;min-width:82px;}

      .comment-error{margin:0 12px 10px;}

    }

    /* -- Comment actions -- */
    .c-actions{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap;}
    .c-time{font-size:11px;color:var(--muted);margin-right:4px;}
    .c-like-btn,.c-del-btn{display:inline-flex;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;padding:3px 7px;border-radius:6px;transition:background .12s,color .12s;font-family:inherit;}
    .c-like-btn:hover{background:rgba(224,36,94,0.08);color:var(--err);}
    .c-like-btn.liked{color:var(--err);}
    .c-del-btn:hover{background:rgba(204,58,58,0.08);color:var(--err);}
    .c-like-btn .material-symbols-outlined,.c-del-btn .material-symbols-outlined{font-size:15px;}
    @keyframes heart-pop2{0%{transform:scale(1);}40%{transform:scale(1.45);}70%{transform:scale(.88);}100%{transform:scale(1);}}
    .c-like-btn.liked .material-symbols-outlined{animation:heart-pop2 .28s ease;}
    /* -- Video on comments page -- */
    .post-media video{width:100%;display:block;max-height:220px;object-fit:cover;background:#000;}
  </style>

</head>

  <div class="main-area">

    <div class="head">

      <button class="back-btn" onclick="history.back()" aria-label="Go back">&#8592;</button>

      <h1>Post</h1>

    </div>



    <div id="post-wrap">

      <div class="empty" id="loading-msg">Loading post...</div>

    </div>

  </div>



  <nav class="mobile-nav">
    <a href="/"><span class="material-symbols-outlined" style="font-size:26px;">home</span></a>

  <script defer src="/static/felcin-common.js?v=20260507-v11"></script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js"></script>

  <script>

    const firebaseConfig={apiKey:"AIzaSyCKmWO04sVRhxZv3EuK_j_53yup9K_LEeE",authDomain:"felcin.firebaseapp.com",projectId:"felcin",storageBucket:"felcin.firebasestorage.app",messagingSenderId:"989891719192",appId:"1:989891719192:web:1266786c201c87f4c8536d"};

    let db,currentUser,postId,currentUserIsAdmin=false;

    let isPostingComment=false;



    function setCommentError(message){

      var el=document.getElementById("comment-error");

      if(!el)return;

      if(!message){el.style.display="none";el.textContent="";return;}

      el.textContent=message;

      el.style.display="block";

    }



    document.addEventListener("DOMContentLoaded",async ()=>{

      if(typeof firebase==="undefined")return;

      firebase.initializeApp(firebaseConfig);

      if(typeof initAppCheck==="function")initAppCheck();

      db=firebase.firestore();



      postId=new URLSearchParams(window.location.search).get("postId");

      if(!postId){document.getElementById("loading-msg").textContent="No post specified.";return;}



      try{await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(e){}

      // Wait for Firebase auth to fully resolve from IndexedDB before checking.

      // authStateReady() (Firebase v10) avoids the cold-start race where

      // onAuthStateChanged fires null before IndexedDB is read, causing a false redirect.

      try{

        if(typeof firebase.auth().authStateReady==="function"){

          await firebase.auth().authStateReady();

        }else{

          await new Promise(resolve=>{const u=firebase.auth().onAuthStateChanged(()=>{u();resolve();});});

        }

      }catch(e){}



      const user=firebase.auth().currentUser;

      if(!user){window.location.href="/login";return;}

      if(!canAccessApp(user)){await firebase.auth().signOut().catch(()=>{});showVerificationNoticeAndRedirect();return;}

      currentUser=user;

      if(typeof checkAdminStatus==="function"){try{currentUserIsAdmin=await checkAdminStatus(user.uid);}catch(e){currentUserIsAdmin=false;}}

      loadPost();

    });



    async function loadPost(){

      const wrap=document.getElementById("post-wrap");

      try{

        const pDoc=await db.collection("posts").doc(postId).get();

        if(!pDoc.exists){wrap.innerHTML='<div class="empty">Post not found or has been removed.</div>';return;}

        const post=pDoc.data();



        // Author profile

        let author={displayName:"User",photoURL:"",photoFocusY:50};

        try{

          const uDoc=await db.collection("users").doc(post.authorId).get();

          const pubDoc=await db.collection("users").doc(post.authorId).collection("public").doc("profile").get();

          const b=uDoc.exists?uDoc.data():{};

          const p=pubDoc.exists?pubDoc.data():{};

          author={displayName:p.displayName||b.displayName||"User",photoURL:p.photoURL||b.photoURL||"",photoFocusY:p.photoFocusY??b.photoFocusY??50};

        }catch(e){}



        const initial=author.displayName.charAt(0).toUpperCase();

        const time=typeof getTimeString==="function"?getTimeString(post.createdAt):"";

        const avatarHtml=author.photoURL?'<img class="post-avatar" src="'+esc(author.photoURL)+'" alt=""'+getAvatarStyleAttr(author.photoFocusY)+'>':'<div class="post-avatar-fallback">'+initial+'</div>';



        let mediaHtml="";

        if(post.mediaUrl){

          const type=typeof resolveMediaType==="function"?resolveMediaType(post.contentType,post.mimeType,post.mediaUrl):"image";

          if(type==="video"){

            mediaHtml='<div class="post-media"><video src="'+esc(post.mediaUrl)+'" controls playsinline></video></div>';

          }else{

            mediaHtml='<div class="post-media"><img src="'+esc(post.mediaUrl)+'" alt="Post media" loading="lazy"></div>';

          }

        }



        const captionHtml=post.caption||post.text?'<div class="post-body"><div class="caption">'+esc(post.caption||post.text)+'</div></div>':"";



        // Check if liked

        let liked=false;

        try{

          const likeDoc=await db.collection("posts").doc(postId).collection("likes").doc(currentUser.uid).get();

          liked=likeDoc.exists;

        }catch(e){}



        const canDeletePost=post.authorId===currentUser.uid||((typeof OWNER_UIDS!=="undefined")&&OWNER_UIDS.indexOf(currentUser.uid)!==-1);

        const deleteBtnHtml=canDeletePost?'<button id="delete-post-btn"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:middle;">delete</span> Delete</button>':"";



        const html='<div class="post-detail"><div class="post-header">'+avatarHtml+'<div><div class="post-author"><a href="/user-profile?uid='+esc(post.authorId)+'">'+esc(author.displayName)+'</a></div><div class="post-time">'+esc(time)+'</div></div></div>'+mediaHtml+captionHtml+'<div class="post-stats" id="post-stats">'+(post.likes||0)+' likes &middot; '+(post.comments||0)+' comments</div><div class="post-actions"><button id="like-btn" class="'+(liked?"liked":"")+'"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:middle;">'+(liked?"favorite":"favorite_border")+'</span> '+(liked?"Liked":"Like")+'</button><button id="repost-post-btn"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:middle;">repeat</span> Repost</button><button id="share-post-btn"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:middle;">share</span> Share</button>'+deleteBtnHtml+'<button onclick="window.location.href=\'/report?type=post&id='+esc(postId)+'\'"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:middle;">flag</span> Report</button></div></div><div class="comment-section"><div class="comment-form"><input type="text" id="comment-input" placeholder="Write a comment..." maxlength="500" /><button id="comment-btn">Post</button></div><div id="comment-error" class="comment-error"></div><div class="comment-list" id="comment-list"></div></div>';



        wrap.innerHTML=html;

        setTimeout(function(){
          var cs=document.querySelector(".comment-section");
          if(cs)cs.scrollIntoView({behavior:"smooth",block:"start"});
        },200);

        document.getElementById("like-btn").addEventListener("click",toggleLike);

        document.getElementById("repost-post-btn").addEventListener("click",repostCurrentPost);

        document.getElementById("share-post-btn").addEventListener("click",shareCurrentPost);

        const deleteBtn=document.getElementById("delete-post-btn");

        if(deleteBtn){deleteBtn.addEventListener("click",deleteCurrentPost);}

        document.getElementById("comment-btn").addEventListener("click",postComment);

        document.getElementById("comment-input").addEventListener("keydown",(e)=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();postComment();}});

        loadComments();

        // Comment like/delete delegation
        document.getElementById("comment-list").addEventListener("click",async function(e){
          var lb=e.target.closest(".c-like-btn");
          if(lb&&currentUser){
            e.preventDefault();
            var cid=lb.dataset.cid;
            if(!cid)return;
            var was=lb.classList.contains("liked");
            var now=!was;
            lb.classList.toggle("liked",now);
            var ic=lb.querySelector(".material-symbols-outlined");
            if(ic)ic.textContent=now?"favorite":"favorite_border";
            var ce=lb.querySelector(".c-lk-count");
            if(ce)ce.textContent=String(Math.max(0,(parseInt(ce.textContent)||0)+(now?1:-1)));
            try{
              await db.collection("posts").doc(postId).collection("comments").doc(cid).update({likes:firebase.firestore.FieldValue.increment(now?1:-1)});
            }catch(err){
              lb.classList.toggle("liked",was);
              if(ic)ic.textContent=was?"favorite":"favorite_border";
              if(ce)ce.textContent=String(Math.max(0,(parseInt(ce.textContent)||0)+(was?1:-1)));
            }
            return;
          }
          var delE=e.target.closest(".c-del-btn");
          if(delE&&currentUser){
            e.preventDefault();
            var cid2=delE.dataset.cid;
            if(!cid2||!confirm("Delete this comment?"))return;
            try{
              await db.collection("posts").doc(postId).collection("comments").doc(cid2).delete();
              await db.collection("posts").doc(postId).update({comments:firebase.firestore.FieldValue.increment(-1)});
              loadComments();
            }catch(err2){console.error("Delete comment:",err2);}
          }
        });

      }catch(err){

        console.error("Load post error:",err);

        wrap.innerHTML='<div class="empty">We couldn\'t load this post. Please refresh and try again.</div>';

      }

    }



    async function toggleLike(){

      const btn=document.getElementById("like-btn");

      const likeRef=db.collection("posts").doc(postId).collection("likes").doc(currentUser.uid);

      const postRef=db.collection("posts").doc(postId);

      try{

        const doc=await likeRef.get();

        if(doc.exists){

          await likeRef.delete();

          await postRef.update({likes:firebase.firestore.FieldValue.increment(-1)});

          btn.classList.remove("liked");

          btn.innerHTML='<span class="material-symbols-outlined" style="font-size:20px;vertical-align:middle;">favorite_border</span> Like';

        }else{

          await likeRef.set({userId:currentUser.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});

          await postRef.update({likes:firebase.firestore.FieldValue.increment(1)});

          btn.classList.add("liked");

          btn.innerHTML='<span class="material-symbols-outlined" style="font-size:20px;vertical-align:middle;">favorite</span> Liked';

        }

      }catch(e){console.error("Like error:",e);}

    }



    async function postComment(){

      if(isPostingComment)return;

      const input=document.getElementById("comment-input");

      const text=input.value.trim();

      if(!text)return;

      const btn=document.getElementById("comment-btn");

      setCommentError("");

      isPostingComment=true;

      btn.disabled=true;

      btn.textContent="Posting...";

      try{

        await db.collection("posts").doc(postId).collection("comments").add({

          text:text,

          authorId:currentUser.uid,

          createdAt:firebase.firestore.FieldValue.serverTimestamp()

        });

        await db.collection("posts").doc(postId).update({comments:firebase.firestore.FieldValue.increment(1)});

        input.value="";

        loadComments();

      }catch(e){

        console.error("Comment error:",e);

        setCommentError("We couldn't post your comment. Check your connection and try again.");

      }

      btn.disabled=false;

      btn.textContent="Post";

      isPostingComment=false;

    }



    async function shareCurrentPost(){

      const btn=document.getElementById("share-post-btn");

      const url=window.location.origin+"/comments?postId="+postId;

      if(typeof shareUrl==="function"){

        await shareUrl(url,{title:"Felcin Post",text:"Check out this post on Felcin",button:btn,successLabel:"Copied!",defaultLabel:"Share"});

        return;

      }

      if(navigator.share){

        await navigator.share({title:"Felcin Post",url:url}).catch(()=>{});

      }

    }



    async function repostCurrentPost(){

      const btn=document.getElementById("repost-post-btn");

      if(!btn||!currentUser||typeof repostPost!=="function")return;

      btn.disabled=true;

      await repostPost(postId,currentUser,db,{button:btn,successLabel:"Reposted!",alreadyLabel:"Already reposted",defaultLabel:"Repost"});

      btn.disabled=false;

    }



    async function deleteCurrentPost(){

      const btn=document.getElementById("delete-post-btn");

      if(!btn||!currentUser||typeof deletePost!=="function")return;

      btn.disabled=true;

      try{

        const result=await deletePost(postId,currentUser,db,{confirmMessage:"Delete this post permanently?"});

        if(result&&result.ok){window.location.href="/";return;}

        if(!result||result.reason!=="cancelled"){alert("We couldn't delete this post. Please try again.");}

      }catch(e){

        alert("We couldn't delete this post. Please try again.");

      }

      btn.disabled=false;

    }



    async function loadComments(){

      const list=document.getElementById("comment-list");

      try{

        const snap=await db.collection("posts").doc(postId).collection("comments").orderBy("createdAt","asc").limit(50).get();

        if(snap.empty){list.innerHTML='<div class="empty" style="padding:24px;">No comments yet. Be the first!</div>';return;}

        const authorIds=[...new Set(snap.docs.map(d=>d.data().authorId))];

        const profiles={};

        await Promise.all(authorIds.map(async uid=>{

          try{

            const [u,p]=await Promise.all([

              db.collection("users").doc(uid).get(),

              db.collection("users").doc(uid).collection("public").doc("profile").get()

            ]);

            const b=u.exists?u.data():{};

            const pb=p.exists?p.data():{};

            profiles[uid]={displayName:pb.displayName||b.displayName||"User",photoURL:pb.photoURL||b.photoURL||"",photoFocusY:pb.photoFocusY??b.photoFocusY??50};

          }catch(e){profiles[uid]={displayName:"User",photoURL:"",photoFocusY:50};}

        }));

        list.innerHTML="";

        snap.forEach(doc=>{

          const c=doc.data();

          const pr=profiles[c.authorId]||{displayName:"User",photoURL:"",photoFocusY:50};

          const init=pr.displayName.charAt(0).toUpperCase();

          const avHtml=pr.photoURL?'<img class="c-avatar" src="'+esc(pr.photoURL)+'" alt=""'+getAvatarStyleAttr(pr.photoFocusY)+'>':'<div class="c-avatar-fallback">'+init+'</div>';

          const time=typeof getTimeString==="function"?getTimeString(c.createdAt):"";

          const el=document.createElement("div");

          el.className="comment-item";

          const isMyC=c.authorId===currentUser.uid;
          const delBtnH=(isMyC||currentUserIsAdmin)?'<button class="c-del-btn" data-cid="'+esc(doc.id)+'" aria-label="Delete comment"><span class="material-symbols-outlined">delete</span></button>':'';
          el.innerHTML=avHtml+'<div class="c-body"><div class="c-name"><a href="/user-profile?uid='+esc(c.authorId)+'">'+esc(pr.displayName)+'</a></div><div class="c-text">'+esc(c.text)+'</div><div class="c-actions"><span class="c-time">'+esc(time)+'</span><button class="c-like-btn" data-cid="'+esc(doc.id)+'" aria-label="Like comment"><span class="material-symbols-outlined">favorite_border</span><span class="c-lk-count">'+(c.likes||0)+'</span></button>'+delBtnH+'</div></div>';

          list.appendChild(el);

        });

      }catch(e){

        console.error("Comments error:",e);

        list.innerHTML='<div class="empty">We couldn\'t load comments. Please refresh and try again.</div>';

      }

    }



    function esc(t){const d=document.createElement("div");d.textContent=String(t||"");return d.innerHTML;}

  </script>

</body>

</html>
