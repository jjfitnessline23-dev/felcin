name: Android Build

on:
  # Disabled — using Codemagic for Android builds
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger (emergency only)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BUNDLE_ID: com.felcin.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 200 ))" >> $GITHUB_ENV

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Patch capacitor.config.json (Live URL mode)
        run: |
          python3 << 'PYEOF'
          import json
          with open('capacitor.config.json', 'r') as f:
              config = json.load(f)
          config['appId'] = 'com.felcin.app'
          config['server'] = {'url': 'https://www.felcin.com', 'cleartext': False}
          config.pop('webDir', None)
          if 'android' not in config:
              config['android'] = {}
          with open('capacitor.config.json', 'w') as f:
              json.dump(config, f, indent=2)
          print("Mode: live URL -> https://www.felcin.com")
          PYEOF

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Sync Android
        run: npx cap sync android

      - name: Bump versionCode
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/felcin-release.keystore

      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/felcin-release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Save AAB as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: App-${{ github.run_number }}.aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload to Play Console (internal track)
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.felcin.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
