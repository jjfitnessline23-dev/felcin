workflows:
  ios-app-store:
    name: Felcin iOS — App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.felcin.app
      vars:
        BUNDLE_ID: com.felcin.app
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: "6763660775"
    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Add iOS platform (if not present)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Register bundle ID and create provisioning profile
        script: |
          app-store-connect create-certificate --type IOS_DISTRIBUTION
          app-store-connect list-devices
          app-store-connect create-profile \
            --bundle-id "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-type IOS_DISTRIBUTION \
            --profile-name "Felcin App Store"

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Set bundle ID in Xcode project
        script: |
          xcode-project set-build-version \
            --project ios/App/App.xcodeproj \
            --build-number $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
