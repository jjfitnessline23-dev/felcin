# Felcin CI — iOS + Android
workflows:

  # ── iOS ─────────────────────────────────────────────────────────────────────
  ios-app-store:
    name: Felcin iOS - App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - ios
      xcode: latest
      node: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.felcin.app
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App

    scripts:

      - name: Patch capacitor.config.json (hybrid mode)
        script: |
          python3 << 'PYEOF'
          import json
          with open('capacitor.config.json') as f:
              config = json.load(f)
          config['appId'] = 'com.felcin.app'
          config['server'] = {'url': 'https://www.felcin.com', 'cleartext': False}
          config['webDir'] = 'www'
          config.setdefault('ios', {})
          with open('capacitor.config.json', 'w') as f:
              json.dump(config, f, indent=2)
          print('Mode: hybrid (live URL + embedded bundle)')
          PYEOF

      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
          npm install -g @capacitor/cli

      - name: Build felcin-next static bundle
        script: |
          set -e
          FELCIN_DIR=$(pwd)
          git clone https://github.com/jjfitnessline23-dev/felcin-next.git /tmp/felcin-next
          cd /tmp/felcin-next
          npm install --legacy-peer-deps

          python3 << 'PYEOF'
          import os, re

          for root, dirs, files in os.walk('app/api'):
              for f in files:
                  if f == 'route.ts':
                      p = os.path.join(root, f)
                      c = open(p).read()
                      nc = c.replace("'force-dynamic'", "'force-static'").replace('"force-dynamic"', '"force-static"')
                      if nc != c:
                          open(p, 'w').write(nc)

          dynamic_routes = [
              ('app/(protected)/challenges/[id]/page.tsx', 'id'),
              ('app/(protected)/ghost/[id]/page.tsx', 'id'),
              ('app/(protected)/live/[id]/page.tsx', 'id'),
              ('app/(protected)/podcasts/[id]/page.tsx', 'id'),
              ('app/(protected)/podcasts/live/[id]/page.tsx', 'id'),
              ('app/(protected)/subscribe/[uid]/page.tsx', 'uid'),
              ('app/(protected)/tag/[name]/page.tsx', 'name'),
              ('app/(protected)/trainers/[uid]/page.tsx', 'uid'),
              ('app/(protected)/training-sessions/[sessionId]/page.tsx', 'sessionId'),
              ('app/(public)/run/live/[shareId]/page.tsx', 'shareId'),
          ]
          for path, key in dynamic_routes:
              if os.path.isfile(path):
                  open(path, 'w').write(
                      'import { Suspense } from "react";\nimport PageClient from "./PageClient";\n\n'
                      'export function generateStaticParams() { return [{ ' + key + ': "_" }]; }\n'
                      'export const dynamicParams = false;\n\n'
                      'export default function Page() { return <Suspense fallback={null}><PageClient /></Suspense>; }\n'
                  )

          suspense_pages = [
              'app/(protected)/advertise/page.tsx',
              'app/(protected)/badges/page.tsx',
              'app/(protected)/comments/page.tsx',
              'app/(protected)/creator/page.tsx',
              'app/(protected)/earnings/page.tsx',
              'app/(protected)/explore/page.tsx',
              'app/(protected)/page.tsx',
              'app/(protected)/private-chats/page.tsx',
              'app/(protected)/training-sessions/page.tsx',
          ]
          for page in suspense_pages:
              if os.path.isfile(page):
                  cp = os.path.join(os.path.dirname(page), 'page.content.tsx')
                  os.rename(page, cp)
                  open(page, 'w').write(
                      'import { Suspense } from "react";\nimport PageContent from "./page.content";\n'
                      'export default function Page() { return <Suspense fallback={null}><PageContent /></Suspense>; }\n'
                  )

          up = 'app/(protected)/user-profile/page.tsx'
          if os.path.isfile(up):
              content = open(up).read()
              content = re.sub(r'export async function generateMetadata\b.*?\n\}', '', content, flags=re.DOTALL)
              content = re.sub(r'async function fetchUserProfile\b.*?\n\}', '', content, flags=re.DOTALL)
              content = content.replace('import type { Metadata } from "next";\n', '')
              if 'Suspense' not in content:
                  content = content.replace('import PageClient from "./PageClient";',
                      'import { Suspense } from "react";\nimport PageClient from "./PageClient";')
              content = content.replace('return <PageClient />;', 'return <Suspense fallback={null}><PageClient /></Suspense>;')
              open(up, 'w').write(content)
          PYEOF

          NEXT_PUBLIC_CAPACITOR_BUILD=true \
          NEXT_PUBLIC_API_URL="https://www.felcin.com" \
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" \
          NEXT_PUBLIC_MAPTILER_KEY="9C6j1Ypd0rgipW4RnpiV" \
          npm run build

          [ -f "out/index.html" ] || { echo "ERROR: static build failed"; exit 1; }
          echo "Pages built: $(find out -name '*.html' | wc -l)"

          find out/_next/static/chunks -name '*.js' | xargs perl -i -pe 's|fetch\("/api/|fetch("https://www.felcin.com/api/|g'
          find out/_next/static/chunks -name '*.js' | xargs perl -i -pe "s|fetch\\('/api/|fetch('https://www.felcin.com/api/|g"
          find out/_next/static/chunks -name '*.js' | xargs perl -i -pe 's|\`/api/|\`https://www.felcin.com/api/|g'

          cp -r out "$FELCIN_DIR/www"
          echo "Bundle: $(find "$FELCIN_DIR/www" -name '*.html' | wc -l) pages"

          export FONT_DIR="$FELCIN_DIR/www/fonts"
          python3 << 'PYEOF' || echo "Font step skipped"
          import urllib.request, re, os
          font_dir = os.environ.get('FONT_DIR', '')
          try:
              if not font_dir:
                  raise ValueError('FONT_DIR not set')
              os.makedirs(font_dir, exist_ok=True)
              url = 'https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'})
              css = urllib.request.urlopen(req, timeout=30).read().decode('utf-8')
              woff_urls = list(dict.fromkeys(re.findall(r'url\((https://fonts\.gstatic\.com/[^)]+\.woff2)\)', css)))
              for i, u in enumerate(woff_urls):
                  fname = f'ms{i}.woff2'
                  urllib.request.urlretrieve(u, os.path.join(font_dir, fname))
                  css = css.replace(u, f'/fonts/{fname}')
              open(os.path.join(font_dir, 'ms.css'), 'w').write(css)
              print(f'Fonts: {len(woff_urls)} woff2 files')
          except Exception as e:
              print(f'WARNING: font download skipped ({e})')
          PYEOF

      - name: Add iOS platform (fresh)
        script: |
          rm -rf ios
          npx cap add ios

      - name: Set deployment target to 16.0
        script: |
          python3 << 'PYEOF'
          import re
          path = 'ios/App/Podfile'
          content = open(path).read()
          content = re.sub(r"platform :ios, '[0-9.]+'", "platform :ios, '16.0'", content)
          open(path, 'w').write(content)
          PYEOF

      - name: Pod install
        script: cd ios/App && pod install

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Configure GoogleService-Info.plist and Info.plist
        script: |
          cp GoogleService-Info.plist ios/App/App/GoogleService-Info.plist

          gem install xcodeproj --quiet 2>/dev/null || true
          ruby << 'RUBYEOF'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          app_group = project.main_group['App']
          unless app_group.find_file_by_path('GoogleService-Info.plist')
            ref = app_group.new_file('GoogleService-Info.plist')
            ref.last_known_file_type = 'text.plist.xml'
            project.targets.first.resources_build_phase.add_file_reference(ref)
            project.save
          end
          RUBYEOF

          REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/App/App/GoogleService-Info.plist)
          export REVERSED_CLIENT_ID

          python3 << 'PYEOF'
          import os, plistlib
          plist_path = 'ios/App/App/Info.plist'
          with open(plist_path, 'rb') as f:
              plist = plistlib.load(f)

          rid = os.environ['REVERSED_CLIENT_ID']
          url_types = [u for u in plist.get('CFBundleURLTypes', []) if u.get('CFBundleURLName') != 'GoogleSignIn']
          url_types.append({'CFBundleURLName': 'GoogleSignIn', 'CFBundleURLSchemes': [rid]})
          plist['CFBundleURLTypes'] = url_types

          plist['NSLocationWhenInUseUsageDescription'] = 'Felcin uses your location to track your running routes live on the map and save your PRs.'
          plist['NSLocationAlwaysAndWhenInUseUsageDescription'] = 'Felcin uses your location to track running routes and show your position on the map.'
          plist['NSCameraUsageDescription'] = 'Felcin needs camera access to take photos and videos for posts and stories.'
          plist['NSMicrophoneUsageDescription'] = 'Felcin needs microphone access to record audio for videos.'
          plist['NSPhotoLibraryUsageDescription'] = 'Felcin needs photo library access to share photos and videos.'
          plist['NSPhotoLibraryAddUsageDescription'] = 'Felcin needs permission to save photos and videos to your library.'
          plist['ITSAppUsesNonExemptEncryption'] = False

          with open(plist_path, 'wb') as f:
              plistlib.dump(plist, f, fmt=plistlib.FMT_XML)
          print('Info.plist configured')
          PYEOF

      - name: Set app icon and black launch screen
        script: |
          cp ios-icons/*.png ios/App/App/Assets.xcassets/AppIcon.appiconset/
          cp ios-icons/Contents.json ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json

          python3 << 'PYEOF'
          import re
          path = 'ios/App/App/Base.lproj/LaunchScreen.storyboard'
          content = open(path).read()
          content = re.sub(
              r'<color key="backgroundColor"[^/]*/?>',
              '<color key="backgroundColor" red="0.0" green="0.0" blue="0.0" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>',
              content
          )
          open(path, 'w').write(content)
          PYEOF

      - name: Patch ViewController.swift and AppDelegate.swift
        script: |
          cat > "ios/App/App/ViewController.swift" << 'SWIFTEOF'
          import UIKit
          import Capacitor
          import WebKit
          import Network

          class ViewController: CAPBridgeViewController {
              override func viewDidLoad() {
                  super.viewDidLoad()
                  self.view.backgroundColor = UIColor.black
                  self.webView?.isOpaque = false
                  self.webView?.backgroundColor = UIColor.black
                  self.webView?.scrollView.backgroundColor = UIColor.black

                  // Synchronous check immediately after bridge init so we redirect
                  // before WKWebView has a chance to show a network error page.
                  if !isConnectedSync() {
                      webView?.stopLoading()
                      webView?.load(URLRequest(url: URL(string: "felcin://localhost/")!))
                  }
              }

              // Blocks main thread for up to 300ms (typically < 5ms on device).
              // Must be synchronous so the redirect fires before any error UI appears.
              private func isConnectedSync() -> Bool {
                  let monitor = NWPathMonitor()
                  var connected = true
                  let semaphore = DispatchSemaphore(value: 0)
                  monitor.pathUpdateHandler = { path in
                      connected = path.status == .satisfied
                      monitor.cancel()
                      semaphore.signal()
                  }
                  monitor.start(queue: DispatchQueue(label: "com.felcin.netcheck"))
                  _ = semaphore.wait(timeout: .now() + 0.3)
                  return connected
              }

              override func capacitorDidLoad() {
                  self.webView?.isOpaque = false
                  self.webView?.backgroundColor = UIColor.black
                  self.webView?.scrollView.backgroundColor = UIColor.black
              }

              @available(iOS 15.0, *)
              override func webView(_ webView: WKWebView, requestMediaCapturePermissionFor origin: WKSecurityOrigin, initiatedByFrame frame: WKFrameInfo, type: WKMediaCaptureType, decisionHandler: @escaping (WKPermissionDecision) -> Void) {
                  decisionHandler(.grant)
              }
          }
          SWIFTEOF

          cat > "ios/App/App/AppDelegate.swift" << 'SWIFTEOF'
          import UIKit
          import Capacitor
          import FirebaseCore

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  FirebaseApp.configure()
                  return true
              }

              func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -> Bool {
                  return ApplicationDelegateProxy.shared.application(app, open: url, options: options)
              }

              func application(_ application: UIApplication, continue userActivity: NSUserActivity, restorationHandler: @escaping ([UIUserActivityRestoring]?) -> Void) -> Bool {
                  return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)
              }
          }
          SWIFTEOF

      - name: Enable Google Sign-In subspec
        script: |
          perl -i -pe "s/default_subspec = 'Lite'/default_subspec = 'Google'/" \
            node_modules/@capacitor-firebase/authentication/CapacitorFirebaseAuthentication.podspec

      - name: Add Sign in with Apple entitlement
        script: |
          python3 << 'PYEOF'
          open("ios/App/App/App.entitlements", "w").write("""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
              <key>com.apple.developer.applesignin</key>
              <array><string>Default</string></array>
              <key>com.apple.developer.associated-domains</key>
              <array>
                  <string>applinks:felcin.com</string>
                  <string>applinks:www.felcin.com</string>
              </array>
          </dict></plist>""".strip())
          PYEOF

          gem install xcodeproj --quiet 2>/dev/null || true
          ruby -e "
          require 'xcodeproj'
          p = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          p.targets.each{|t| t.build_configurations.each{|c| c.build_settings['CODE_SIGN_ENTITLEMENTS']='App/App.entitlements'}}
          p.save
          "

      - name: Final pod install
        script: |
          cd ios/App
          rm -f Podfile.lock
          pod install --repo-update

      - name: Inject Watch app target
        script: |
          gem install xcodeproj --quiet 2>/dev/null || true
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo "$WATCH_PROVISIONING_PROFILE" | base64 --decode > /tmp/watch_profile.mobileprovision
          security cms -D -i /tmp/watch_profile.mobileprovision -o /tmp/watch_decoded.plist 2>/dev/null
          WATCH_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/watch_decoded.plist)
          cp /tmp/watch_profile.mobileprovision "$PROFILES/$WATCH_UUID.mobileprovision"
          export WATCH_PROFILE_UUID="$WATCH_UUID"
          ruby inject_watch_target.rb

      - name: Set up code signing
        script: |
          echo "$DIST_CERT_P12" | base64 --decode > /tmp/distribution.p12

          KEYCHAIN=/tmp/app-signing.keychain-db
          security create-keychain -p codemagic123 "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p codemagic123 "$KEYCHAIN"
          security import /tmp/distribution.p12 -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k codemagic123 "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" ~/Library/Keychains/login.keychain-db

          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo "$PROVISIONING_PROFILE" | base64 --decode > /tmp/profile.mobileprovision
          security cms -D -i /tmp/profile.mobileprovision -o /tmp/decoded.plist 2>/dev/null
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/decoded.plist)
          cp /tmp/profile.mobileprovision "$PROFILES/$UUID.mobileprovision"

          echo "$WATCH_PROVISIONING_PROFILE" | base64 --decode > /tmp/watch_profile.mobileprovision
          security cms -D -i /tmp/watch_profile.mobileprovision -o /tmp/watch_decoded.plist 2>/dev/null
          WATCH_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/watch_decoded.plist)

          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          perl -i -pe "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$UUID\";/g" "$PBXPROJ"
          perl -i -pe 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' "$PBXPROJ"
          perl -i -pe 's/PRODUCT_BUNDLE_IDENTIFIER = ("?)app\.felcin\.social\1;/PRODUCT_BUNDLE_IDENTIFIER = "com.felcin.app";/g' "$PBXPROJ"

          cat > /tmp/export_options.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>UWSVWR4VTX</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.felcin.app</key><string>$UUID</string>
              <key>com.felcin.app.watchkitapp</key><string>$WATCH_UUID</string>
            </dict>
          </dict></plist>
          PLIST

      - name: Set build number
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist

      - name: Build IPA
        script: |
          set -eo pipefail
          ARCHIVE="build/ios/xcarchive/App.xcarchive"
          IPA_DIR="build/ios/ipa"
          mkdir -p "$(dirname $ARCHIVE)" "$IPA_DIR"

          xcodebuild \
            -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" \
            -archivePath "$ARCHIVE" archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM=UWSVWR4VTX \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION=1.6 \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$IPA_DIR" \
            -exportOptionsPlist /tmp/export_options.plist

          echo "IPA: $(find $IPA_DIR -name '*.ipa' | head -1)"

      - name: Patch Watch icons in IPA
        script: |
          CWD="$(pwd)"
          IPA_FILE="$(find "$CWD/build/ios/ipa" -name '*.ipa' | head -1)"
          [ -n "$IPA_FILE" ] || { echo "No IPA found"; exit 1; }
          echo "Patching Watch icons in: $IPA_FILE"
          PATCH=$(mktemp -d)
          cd "$PATCH"
          unzip -q "$IPA_FILE" -d ex
          WATCH_APP=$(find ex -name "FelcinWatch.app" | head -1)
          MAIN_APP=$(find ex/Payload -maxdepth 1 -name "*.app" | head -1)
          echo "Watch: $WATCH_APP"
          echo "Main:  $MAIN_APP"
          [ -n "$WATCH_APP" ] || { echo "ERROR: FelcinWatch.app not in IPA"; exit 1; }
          LOGO="$CWD/ios-icons/AppIcon-1024@1x.png"
          [ -f "$LOGO" ] || { echo "ERROR: logo not found at $LOGO"; exit 1; }
          WORK=$(mktemp -d)

          # Step 1: Copy PNG icons directly into Watch bundle.
          # CFBundleIconFiles in Info.plist lists AppIcon-80 etc. — system looks for AppIcon-80.png.
          echo "Copying PNG icons into Watch bundle..."
          for SIZE in 80 88 92 100 102 108; do
            sips -z $SIZE $SIZE "$LOGO" --out "$WATCH_APP/AppIcon-${SIZE}.png" > /dev/null && echo "  AppIcon-${SIZE}.png OK" || echo "  AppIcon-${SIZE}.png FAILED"
          done
          cp "$LOGO" "$WATCH_APP/AppIcon-1024.png"
          ICON_COUNT=$(ls "$WATCH_APP"/AppIcon-*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "Icons in Watch bundle: $ICON_COUNT PNGs"
          [ "$ICON_COUNT" -ge "6" ] || { echo "FATAL: sips failed to create icon PNGs"; exit 1; }

          # Step 2: Also compile asset catalog so Assets.car satisfies the 1024x1024-in-catalog requirement.
          XCASSETS="$WORK/WatchIcons.xcassets"
          ICONSET="$XCASSETS/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          printf '%s\n' '{"info":{"author":"xcode","version":1}}' > "$XCASSETS/Contents.json"
          printf '%s\n' '{"images":[{"filename":"i80.png","idiom":"watch","role":"appLauncher","scale":"2x","size":"80x80","subtype":"38mm"},{"filename":"i88.png","idiom":"watch","role":"appLauncher","scale":"2x","size":"88x88","subtype":"40mm"},{"filename":"i92.png","idiom":"watch","role":"appLauncher","scale":"2x","size":"92x92","subtype":"41mm"},{"filename":"i100.png","idiom":"watch","role":"appLauncher","scale":"2x","size":"100x100","subtype":"44mm"},{"filename":"i102.png","idiom":"watch","role":"appLauncher","scale":"2x","size":"102x102","subtype":"45mm"},{"filename":"i108.png","idiom":"watch","role":"appLauncher","scale":"2x","size":"108x108","subtype":"49mm"},{"filename":"i1024.png","idiom":"watch-marketing","scale":"1x","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$ICONSET/Contents.json"
          for SIZE in 80 88 92 100 102 108; do
            sips -z $SIZE $SIZE "$LOGO" --out "$ICONSET/i${SIZE}.png" > /dev/null
          done
          cp "$LOGO" "$ICONSET/i1024.png"
          xcrun actool "$XCASSETS" --compile "$WATCH_APP" --platform watchos --minimum-deployment-target 9.0 --target-device watch --app-icon AppIcon --output-partial-info-plist "$WORK/partial.plist" 2>&1 || echo "actool exit $? (non-fatal)"
          echo "Assets.car: $(ls -lah "$WATCH_APP/Assets.car" 2>/dev/null || echo MISSING)"
          WATCH_PLIST="$WATCH_APP/Info.plist"
          echo "--- Watch plist CFBundleIconFiles before patch ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles" "$WATCH_PLIST" 2>/dev/null || echo "NOT PRESENT (will add)"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "$WATCH_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$WATCH_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$WATCH_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$WATCH_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$WATCH_PLIST"
          for INAME in AppIcon-80 AppIcon-88 AppIcon-92 AppIcon-100 AppIcon-102 AppIcon-108 AppIcon-1024; do
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles: string $INAME" "$WATCH_PLIST"
          done
          echo "--- Watch plist CFBundleIconFiles after patch ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles" "$WATCH_PLIST"
          echo "Re-signing Watch app (entitlements from Watch provisioning profile)..."
          security cms -D -i "$WATCH_APP/embedded.mobileprovision" -o "$WORK/wdec.plist" 2>/dev/null
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" "$WORK/wdec.plist" > "$WORK/watch_ents.plist" 2>/dev/null
          codesign --force --sign "Apple Distribution" --entitlements "$WORK/watch_ents.plist" --timestamp "$WATCH_APP" 2>&1
          echo "Watch re-sign exit: $?"
          echo "Re-signing Frameworks (inside-out order)..."
          find "$MAIN_APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) 2>/dev/null | while read f; do
            codesign --force --sign "Apple Distribution" --timestamp "$f" 2>&1 || true
          done
          echo "Re-signing main App (entitlements from its embedded provisioning profile)..."
          security cms -D -i "$MAIN_APP/embedded.mobileprovision" -o "$WORK/main_prov.plist" 2>/dev/null
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" "$WORK/main_prov.plist" > "$WORK/main_ents.plist" 2>/dev/null
          codesign --force --sign "Apple Distribution" --entitlements "$WORK/main_ents.plist" --timestamp "$MAIN_APP" 2>&1
          echo "Main re-sign exit: $?"
          echo "Verify signature: $(codesign -v "$MAIN_APP" 2>&1 || echo INVALID)"
          echo "Repacking IPA (fresh zip)..."
          rm -f "$IPA_FILE"
          cd ex && zip -qr "$IPA_FILE" Payload/
          echo "IPA size: $(ls -lah "$IPA_FILE" | awk '{print $5}')"
          cd "$CWD"
          echo "Verifying Watch icons in final IPA..."
          VERIFY=$(mktemp -d)
          unzip -q "$IPA_FILE" -d "$VERIFY"
          VWATCH=$(find "$VERIFY" -name "FelcinWatch.app" | head -1)
          VCOUNT=$(ls "$VWATCH"/AppIcon-*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "Icons in final IPA Watch bundle: $VCOUNT"
          [ "$VCOUNT" -ge "6" ] || { echo "FATAL: Icons missing from final IPA"; rm -rf "$VERIFY" "$WORK"; exit 1; }
          echo "=== Watch icon patch verified OK ==="
          rm -rf "$VERIFY" "$WORK" "$PATCH"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true


  # ── Android ──────────────────────────────────────────────────────────────────
  android-google-play:
    name: Felcin Android - Google Play
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      groups:
        - android
        - ios
      java: 21
      node: latest
      vars:
        PACKAGE_NAME: app.felcin.social

    scripts:

      - name: Patch capacitor.config.json (hybrid mode)
        script: |
          python3 << 'PYEOF'
          import json
          with open('capacitor.config.json') as f:
              config = json.load(f)
          config['appId'] = 'app.felcin.social'
          config['server'] = {'url': 'https://www.felcin.com', 'cleartext': False}
          config['webDir'] = 'www'
          with open('capacitor.config.json', 'w') as f:
              json.dump(config, f, indent=2)
          print('Mode: hybrid (live URL + embedded bundle)')
          PYEOF

      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
          npm install -g @capacitor/cli

      - name: Build felcin-next static bundle
        script: |
          set -e
          FELCIN_DIR=$(pwd)
          git clone https://github.com/jjfitnessline23-dev/felcin-next.git /tmp/felcin-next
          cd /tmp/felcin-next
          npm install --legacy-peer-deps

          python3 << 'PYEOF'
          import os, re

          for root, dirs, files in os.walk('app/api'):
              for f in files:
                  if f == 'route.ts':
                      p = os.path.join(root, f)
                      c = open(p).read()
                      nc = c.replace("'force-dynamic'", "'force-static'").replace('"force-dynamic"', '"force-static"')
                      if nc != c:
                          open(p, 'w').write(nc)

          dynamic_routes = [
              ('app/(protected)/challenges/[id]/page.tsx', 'id'),
              ('app/(protected)/ghost/[id]/page.tsx', 'id'),
              ('app/(protected)/live/[id]/page.tsx', 'id'),
              ('app/(protected)/podcasts/[id]/page.tsx', 'id'),
              ('app/(protected)/podcasts/live/[id]/page.tsx', 'id'),
              ('app/(protected)/subscribe/[uid]/page.tsx', 'uid'),
              ('app/(protected)/tag/[name]/page.tsx', 'name'),
              ('app/(protected)/trainers/[uid]/page.tsx', 'uid'),
              ('app/(protected)/training-sessions/[sessionId]/page.tsx', 'sessionId'),
              ('app/(public)/run/live/[shareId]/page.tsx', 'shareId'),
          ]
          for path, key in dynamic_routes:
              if os.path.isfile(path):
                  open(path, 'w').write(
                      'import { Suspense } from "react";\nimport PageClient from "./PageClient";\n\n'
                      'export function generateStaticParams() { return [{ ' + key + ': "_" }]; }\n'
                      'export const dynamicParams = false;\n\n'
                      'export default function Page() { return <Suspense fallback={null}><PageClient /></Suspense>; }\n'
                  )

          suspense_pages = [
              'app/(protected)/advertise/page.tsx',
              'app/(protected)/badges/page.tsx',
              'app/(protected)/comments/page.tsx',
              'app/(protected)/creator/page.tsx',
              'app/(protected)/earnings/page.tsx',
              'app/(protected)/explore/page.tsx',
              'app/(protected)/page.tsx',
              'app/(protected)/private-chats/page.tsx',
              'app/(protected)/training-sessions/page.tsx',
          ]
          for page in suspense_pages:
              if os.path.isfile(page):
                  cp = os.path.join(os.path.dirname(page), 'page.content.tsx')
                  os.rename(page, cp)
                  open(page, 'w').write(
                      'import { Suspense } from "react";\nimport PageContent from "./page.content";\n'
                      'export default function Page() { return <Suspense fallback={null}><PageContent /></Suspense>; }\n'
                  )

          up = 'app/(protected)/user-profile/page.tsx'
          if os.path.isfile(up):
              content = open(up).read()
              content = re.sub(r'export async function generateMetadata\b.*?\n\}', '', content, flags=re.DOTALL)
              content = re.sub(r'async function fetchUserProfile\b.*?\n\}', '', content, flags=re.DOTALL)
              content = content.replace('import type { Metadata } from "next";\n', '')
              if 'Suspense' not in content:
                  content = content.replace('import PageClient from "./PageClient";',
                      'import { Suspense } from "react";\nimport PageClient from "./PageClient";')
              content = content.replace('return <PageClient />;', 'return <Suspense fallback={null}><PageClient /></Suspense>;')
              open(up, 'w').write(content)
          PYEOF

          NEXT_PUBLIC_CAPACITOR_BUILD=true \
          NEXT_PUBLIC_API_URL="https://www.felcin.com" \
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" \
          NEXT_PUBLIC_MAPTILER_KEY="9C6j1Ypd0rgipW4RnpiV" \
          npm run build

          [ -f "out/index.html" ] || { echo "ERROR: static build failed"; exit 1; }
          echo "Pages built: $(find out -name '*.html' | wc -l)"

          find out/_next/static/chunks -name '*.js' | xargs perl -i -pe 's|fetch\("/api/|fetch("https://www.felcin.com/api/|g'
          find out/_next/static/chunks -name '*.js' | xargs perl -i -pe "s|fetch\\('/api/|fetch('https://www.felcin.com/api/|g"
          find out/_next/static/chunks -name '*.js' | xargs perl -i -pe 's|\`/api/|\`https://www.felcin.com/api/|g'

          cp -r out "$FELCIN_DIR/www"
          echo "Bundle: $(find "$FELCIN_DIR/www" -name '*.html' | wc -l) pages"

          export FONT_DIR="$FELCIN_DIR/www/fonts"
          python3 << 'PYEOF' || echo "Font step skipped"
          import urllib.request, re, os
          font_dir = os.environ.get('FONT_DIR', '')
          try:
              if not font_dir:
                  raise ValueError('FONT_DIR not set')
              os.makedirs(font_dir, exist_ok=True)
              url = 'https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'})
              css = urllib.request.urlopen(req, timeout=30).read().decode('utf-8')
              woff_urls = list(dict.fromkeys(re.findall(r'url\((https://fonts\.gstatic\.com/[^)]+\.woff2)\)', css)))
              for i, u in enumerate(woff_urls):
                  fname = f'ms{i}.woff2'
                  urllib.request.urlretrieve(u, os.path.join(font_dir, fname))
                  css = css.replace(u, f'/fonts/{fname}')
              open(os.path.join(font_dir, 'ms.css'), 'w').write(css)
              print(f'Fonts: {len(woff_urls)} woff2 files')
          except Exception as e:
              print(f'WARNING: font download skipped ({e})')
          PYEOF

      - name: Capacitor sync Android
        script: |
          # android/ is committed to git (includes google-services.json + gradlew).
          # Just sync — do NOT rm -rf android or google-services.json is lost.
          npx cap sync android

      - name: Set version code
        script: |
          python3 << 'PYEOF'
          import re
          path = 'android/app/build.gradle'
          content = open(path).read()
          import os
          build_no = int(os.environ.get('BUILD_NUMBER', '1')) + 200
          content = re.sub(r'versionCode \d+', f'versionCode {build_no}', content)
          content = re.sub(r'versionName "[^"]*"', 'versionName "1.6"', content)
          open(path, 'w').write(content)
          print(f'versionCode set to {build_no}')
          PYEOF

      - name: Set app icons
        script: |
          if [ -d "android-icons" ]; then
            cp android-icons/mipmap-mdpi/*.png    android/app/src/main/res/mipmap-mdpi/     2>/dev/null || true
            cp android-icons/mipmap-hdpi/*.png    android/app/src/main/res/mipmap-hdpi/     2>/dev/null || true
            cp android-icons/mipmap-xhdpi/*.png   android/app/src/main/res/mipmap-xhdpi/    2>/dev/null || true
            cp android-icons/mipmap-xxhdpi/*.png  android/app/src/main/res/mipmap-xxhdpi/   2>/dev/null || true
            cp android-icons/mipmap-xxxhdpi/*.png android/app/src/main/res/mipmap-xxxhdpi/  2>/dev/null || true
          fi

      - name: Build signed AAB + APK
        script: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/felcin-release.keystore
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/felcin-release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Publish to Google Play production (straight to review)
        script: |
          pip3 install --quiet google-auth google-api-python-client
          python3 - << 'PYEOF'
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          PACKAGE = 'app.felcin.social'
          AAB = 'android/app/build/outputs/bundle/release/app-release.aab'

          creds_json = os.environ.get('GOOGLE_PLAY_SERVICE_ACCOUNT_JSON', '')
          if not creds_json:
              print('No Google Play credentials — AAB saved as artifact')
              exit(0)

          import tempfile, json
          with tempfile.NamedTemporaryFile(mode='w', suffix='.json', delete=False) as f:
              f.write(creds_json)
              creds_file = f.name

          creds = service_account.Credentials.from_service_account_file(
              creds_file, scopes=['https://www.googleapis.com/auth/androidpublisher'])
          service = build('androidpublisher', 'v3', credentials=creds)
          try:
              edit = service.edits().insert(packageName=PACKAGE, body={}).execute()
              eid = edit['id']
              bundle = service.edits().bundles().upload(
                  packageName=PACKAGE, editId=eid,
                  media_body=MediaFileUpload(AAB, mimetype='application/octet-stream', resumable=True)
              ).execute()
              vc = bundle['versionCode']
              service.edits().tracks().update(
                  packageName=PACKAGE, editId=eid, track='production',
                  body={'releases': [{'versionCodes': [vc], 'status': 'completed'}]}
              ).execute()
              service.edits().commit(packageName=PACKAGE, editId=eid).execute()
              print(f'Published versionCode {vc} to production — sent for review')
          except Exception as e:
              print(f'WARNING: Play Store publish blocked — {e}')
              print('AAB saved as Codemagic artifact. Complete Data Safety form in Play Console then retry.')
          PYEOF

    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
      - android/app/build/outputs/apk/release/app-release.apk
