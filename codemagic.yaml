workflows:
  ios-app-store:
    name: Felcin iOS - App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - ios
      xcode: latest
      node: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.felcin.app
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Build felcin-next static web bundle
        script: |
          set -e
          echo "=== Cloning felcin-next ==="
          git clone https://github.com/jjfitnessline23-dev/felcin-next.git /tmp/felcin-next
          cd /tmp/felcin-next

          echo "=== Installing dependencies ==="
          npm install --legacy-peer-deps

          echo "=== Patching felcin-next for static export ==="
          python3 << 'PYEOF'
          import os
          for root, dirs, files in os.walk('app/api'):
              for f in files:
                  if f == 'route.ts':
                      p = os.path.join(root, f)
                      c = open(p).read()
                      nc = c.replace("'force-dynamic'", "'force-static'").replace('"force-dynamic"', '"force-static"')
                      if nc != c:
                          open(p, 'w').write(nc)
                          print('  API patched: ' + p)
          dynamic_routes = [
              ('app/(protected)/challenges/[id]/page.tsx', 'id'),
              ('app/(protected)/ghost/[id]/page.tsx', 'id'),
              ('app/(protected)/live/[id]/page.tsx', 'id'),
              ('app/(protected)/podcasts/[id]/page.tsx', 'id'),
              ('app/(protected)/podcasts/live/[id]/page.tsx', 'id'),
              ('app/(protected)/subscribe/[uid]/page.tsx', 'uid'),
              ('app/(protected)/tag/[name]/page.tsx', 'name'),
              ('app/(protected)/trainers/[uid]/page.tsx', 'uid'),
              ('app/(protected)/training-sessions/[sessionId]/page.tsx', 'sessionId'),
          ]
          for path, key in dynamic_routes:
              if os.path.isfile(path):
                  c = ('import { Suspense } from "react";\nimport PageClient from "./PageClient";\n\n'
                       'export function generateStaticParams() { return [{ ' + key + ': "_" }]; }\n'
                       'export const dynamicParams = false;\n\n'
                       'export default function Page() { return <Suspense fallback={null}><PageClient /></Suspense>; }\n')
                  open(path, 'w').write(c)
                  print('  Patched: ' + path)
              else:
                  print('  Skipped: ' + path)
          sp = [
              'app/(protected)/advertise/page.tsx',
              'app/(protected)/badges/page.tsx',
              'app/(protected)/comments/page.tsx',
              'app/(protected)/creator/page.tsx',
              'app/(protected)/earnings/page.tsx',
              'app/(protected)/explore/page.tsx',
              'app/(protected)/page.tsx',
              'app/(protected)/private-chats/page.tsx',
              'app/(protected)/training-sessions/page.tsx',
          ]
          w = ('import { Suspense } from "react";\nimport PageContent from "./page.content";\n'
               'export default function Page() { return <Suspense fallback={null}><PageContent /></Suspense>; }\n')
          for page in sp:
              if os.path.isfile(page):
                  cp = os.path.join(os.path.dirname(page), 'page.content.tsx')
                  os.rename(page, cp)
                  open(page, 'w').write(w)
                  print('  Wrapped: ' + page)
              else:
                  print('  Skipped: ' + page)
          print('All patches applied.')
          PYEOF

          echo "=== Building static export ==="
          NEXT_PUBLIC_CAPACITOR_BUILD=true \
          NEXT_PUBLIC_API_URL="https://www.felcin.com" \
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_test_51TeacHFq0Nd4lLkFwHZ7nutFk0jI0H4bmtffnaI92is7ym5KEVuXmppnVMgQhC9qP39zBhgzOukNYUE4yvtiwa0I00CycqtIbo}" \
          npm run build

          if [ ! -f "out/index.html" ]; then
            echo "ERROR: out/index.html not found — static build failed"
            ls -la out/ 2>/dev/null || echo "out/ directory does not exist"
            exit 1
          fi

          echo "=== Static bundle ready at /tmp/felcin-next/out ==="
          ls /tmp/felcin-next/out/ | head -10

      - name: Patch capacitor.config.json for bundled mode
        script: |
          python3 << 'PYEOF'
          import json
          with open('capacitor.config.json', 'r') as f:
              config = json.load(f)
          config['webDir'] = '/tmp/felcin-next/out'
          config['server'] = {
              'hostname': 'www.felcin.com',
              'iosScheme': 'https'
          }
          with open('capacitor.config.json', 'w') as f:
              json.dump(config, f, indent=2)
          print('capacitor.config.json patched:')
          print(f"  webDir: {config['webDir']}")
          print(f"  server: {json.dumps(config['server'])}")
          PYEOF

      - name: Install npm dependencies
        script: npm install --legacy-peer-deps

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Add iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Add GoogleService-Info.plist
        script: |
          # Copy plist from repo into iOS app directory
          cp GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          echo "Plist copied. BUNDLE_ID: $(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' ios/App/App/GoogleService-Info.plist)"

          # Add plist to Xcode project so it's bundled into the app
          gem install xcodeproj --quiet 2>/dev/null || true
          ruby << 'RUBYEOF'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          app_group = project.main_group['App']
          unless app_group.find_file_by_path('GoogleService-Info.plist')
            file_ref = app_group.new_file('GoogleService-Info.plist')
            file_ref.last_known_file_type = 'text.plist.xml'
            project.targets.first.resources_build_phase.add_file_reference(file_ref)
            project.save
            puts 'GoogleService-Info.plist added to Xcode project'
          else
            puts 'GoogleService-Info.plist already present in project'
          end
          RUBYEOF

          # Extract REVERSED_CLIENT_ID and register it as a URL scheme (required for Google Sign-In)
          REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/App/App/GoogleService-Info.plist)
          echo "Registering URL scheme: $REVERSED_CLIENT_ID"
          export REVERSED_CLIENT_ID
          python3 << 'PYEOF'
          import os, plistlib
          reversed_id = os.environ['REVERSED_CLIENT_ID']
          plist_path = 'ios/App/App/Info.plist'
          with open(plist_path, 'rb') as f:
              plist = plistlib.load(f)
          url_types = plist.get('CFBundleURLTypes', [])
          url_types = [u for u in url_types if u.get('CFBundleURLName') != 'GoogleSignIn']
          url_types.append({'CFBundleURLName': 'GoogleSignIn', 'CFBundleURLSchemes': [reversed_id]})
          plist['CFBundleURLTypes'] = url_types
          with open(plist_path, 'wb') as f:
              plistlib.dump(plist, f, fmt=plistlib.FMT_XML)
          print(f'URL scheme registered: {reversed_id}')
          PYEOF

      - name: Set app icon
        script: |
          ICON_SRC="ios-icons"
          ICON_DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          echo "Copying custom app icons..."
          cp "$ICON_SRC"/*.png "$ICON_DEST/"
          cp "$ICON_SRC/Contents.json" "$ICON_DEST/Contents.json"
          echo "Icons installed:"
          ls "$ICON_DEST"

      - name: Patch WebView dark background and camera permissions
        script: |
          SWIFT_FILE="ios/App/App/ViewController.swift"
          cat > "$SWIFT_FILE" << SWIFTEOF
          import UIKit
          import Capacitor
          import WebKit

          class ViewController: CAPBridgeViewController {
              override func viewDidLoad() {
                  super.viewDidLoad()
                  self.view.backgroundColor = UIColor.black
                  self.webView?.isOpaque = false
                  self.webView?.backgroundColor = UIColor.black
                  self.webView?.scrollView.backgroundColor = UIColor.black
              }
              override func capacitorDidLoad() {
                  self.webView?.isOpaque = false
                  self.webView?.backgroundColor = UIColor.black
                  self.webView?.scrollView.backgroundColor = UIColor.black
              }
              @available(iOS 15.0, *)
              override func webView(_ webView: WKWebView, requestMediaCapturePermissionFor origin: WKSecurityOrigin, initiatedByFrame frame: WKFrameInfo, type: WKMediaCaptureType, decisionHandler: @escaping (WKPermissionDecision) -> Void) {
                  decisionHandler(.grant)
              }
          }
          SWIFTEOF
          echo "ViewController.swift patched"

      - name: Patch AppDelegate to initialize Firebase
        script: |
          APPDELEGATE="ios/App/App/AppDelegate.swift"
          cat > "$APPDELEGATE" << 'SWIFTEOF'
          import UIKit
          import Capacitor
          import FirebaseCore
          import WebKit

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate {

              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  FirebaseApp.configure()
                  // Clear HTTP cache on every launch so the app always loads the latest web code
                  URLCache.shared.removeAllCachedResponses()
                  WKWebsiteDataStore.default().removeData(
                      ofTypes: [WKWebsiteDataTypeDiskCache, WKWebsiteDataTypeMemoryCache],
                      modifiedSince: Date.distantPast
                  ) { }
                  return true
              }

              func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -> Bool {
                  return ApplicationDelegateProxy.shared.application(app, open: url, options: options)
              }

              func application(_ application: UIApplication, continue userActivity: NSUserActivity, restorationHandler: @escaping ([UIUserActivityRestoring]?) -> Void) -> Bool {
                  return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)
              }
          }
          SWIFTEOF
          echo "AppDelegate.swift patched with FirebaseApp.configure() and cache clearing"

      - name: Restrict to iPhone only
        script: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          perl -i -pe 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' "$PBXPROJ"
          perl -i -pe 's/TARGETED_DEVICE_FAMILY = 1,2;/TARGETED_DEVICE_FAMILY = 1;/g' "$PBXPROJ"
          echo "TARGETED_DEVICE_FAMILY set to iPhone only:"
          grep "TARGETED_DEVICE_FAMILY" "$PBXPROJ"

      - name: Set build number
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Felcin needs access to your camera to take photos and videos for posts and stories.'" ios/App/App/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Felcin needs access to your camera to take photos and videos for posts and stories.'" ios/App/App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Felcin needs access to your microphone to record audio for videos.'" ios/App/App/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'Felcin needs access to your microphone to record audio for videos.'" ios/App/App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Felcin needs access to your photo library to share photos and videos.'" ios/App/App/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Felcin needs access to your photo library to share photos and videos.'" ios/App/App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Felcin needs permission to save photos and videos to your library.'" ios/App/App/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'Felcin needs permission to save photos and videos to your library.'" ios/App/App/Info.plist

          echo "Build number set to: $BUILD_NUMBER"
          echo "Permissions patched into Info.plist"

      - name: Enable Google subspec in CapacitorFirebaseAuthentication
        script: |
          PODSPEC="node_modules/@capacitor-firebase/authentication/CapacitorFirebaseAuthentication.podspec"
          echo "=== Podspec before patch ==="
          grep "default_subspec" "$PODSPEC"
          perl -i -pe "s/default_subspec = 'Lite'/default_subspec = 'Google'/" "$PODSPEC"
          echo "=== Podspec after patch ==="
          grep "default_subspec" "$PODSPEC"

      - name: Add Sign in with Apple entitlement and Associated Domains
        script: |
          python3 << 'PYEOF'
          entitlements = """<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.applesignin</key>
              <array>
                  <string>Default</string>
              </array>
              <key>com.apple.developer.associated-domains</key>
              <array>
                  <string>applinks:felcin.com</string>
                  <string>applinks:www.felcin.com</string>
              </array>
          </dict>
          </plist>"""
          with open("ios/App/App/App.entitlements", "w") as f:
              f.write(entitlements.strip())
          print("App.entitlements written")
          PYEOF

          gem install xcodeproj --quiet 2>/dev/null || true
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
              puts \"Set CODE_SIGN_ENTITLEMENTS for #{target.name} - #{config.name}\"
            end
          end
          project.save
          puts 'Project saved'
          "

          echo "=== Verifying ==="
          grep "CODE_SIGN_ENTITLEMENTS" ios/App/App.xcodeproj/project.pbxproj || echo "ERROR: not found!"

      - name: Install CocoaPods
        script: |
          cd ios/App
          rm -f Podfile.lock
          pod install --repo-update

      - name: Set up signing
        script: |
          echo "=== Checking env vars ==="
          echo "DIST_CERT_P12 length: ${#DIST_CERT_P12}"
          echo "PROVISIONING_PROFILE length: ${#PROVISIONING_PROFILE}"
          echo "DIST_CERT_PASSWORD length: ${#DIST_CERT_PASSWORD}"

          echo "=== Decoding certificate ==="
          echo "$DIST_CERT_P12" | base64 --decode > /tmp/distribution.p12
          echo "p12 file size: $(wc -c < /tmp/distribution.p12) bytes"

          echo "=== Setting up keychain ==="
          KEYCHAIN_PATH=/tmp/app-signing.keychain-db
          KEYCHAIN_PASS=codemagic123
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import /tmp/distribution.p12 -k "$KEYCHAIN_PATH" \
            -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            ~/Library/Keychains/login.keychain-db
          echo "Keychain set up"

          echo "=== Installing provisioning profile ==="
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROVISIONING_PROFILE" | base64 --decode > /tmp/profile.mobileprovision
          echo "Profile file size: $(wc -c < /tmp/profile.mobileprovision) bytes"
          openssl smime -inform DER -verify -noverify -in /tmp/profile.mobileprovision -out /tmp/decoded_profile.plist 2>/dev/null
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/decoded_profile.plist 2>/dev/null)
          if [ -z "$UUID" ]; then
            UUID=$(strings /tmp/profile.mobileprovision | grep -E '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$' | head -1)
          fi
          echo "Profile UUID: $UUID"
          cp /tmp/profile.mobileprovision "$PROFILE_DIR/$UUID.mobileprovision"
          echo "Profile installed"

          echo "=== Patching App project for manual signing ==="
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          perl -i -pe "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$UUID\";/g" "$PBXPROJ"
          perl -i -pe 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' "$PBXPROJ"
          echo "Patched. Verifying:"
          grep "CODE_SIGN_STYLE\|PROVISIONING_PROFILE_SPECIFIER\|CODE_SIGN_IDENTITY" "$PBXPROJ"

          echo "=== Generating export options ==="
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0"><dict>'
            echo '  <key>method</key><string>app-store-connect</string>'
            echo '  <key>teamID</key><string>UWSVWR4VTX</string>'
            echo '  <key>signingStyle</key><string>manual</string>'
            echo '  <key>provisioningProfiles</key><dict>'
            echo "    <key>com.felcin.app</key><string>$UUID</string>"
            echo '  </dict>'
            echo '</dict></plist>'
          } > /Users/builder/export_options.plist
          echo "Done"

      - name: Build IPA
        script: |
          openssl smime -inform DER -verify -noverify -in /tmp/profile.mobileprovision -out /tmp/decoded_profile.plist 2>/dev/null
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/decoded_profile.plist 2>/dev/null)
          if [ -z "$UUID" ]; then
            UUID=$(strings /tmp/profile.mobileprovision | grep -E '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$' | head -1)
          fi
          echo "Using profile UUID: $UUID"

          ARCHIVE_PATH="build/ios/xcarchive/App.xcarchive"
          IPA_PATH="build/ios/ipa"
          mkdir -p "$IPA_PATH"

          echo "=== Archiving ==="
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM=UWSVWR4VTX \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PRODUCT_BUNDLE_IDENTIFIER=com.felcin.app \
            MARKETING_VERSION=1.3 \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER

          echo "=== Exporting IPA ==="
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_PATH" \
            -exportOptionsPlist /Users/builder/export_options.plist

      - name: Upload to TestFlight
        script: |
          echo "$APP_STORE_KEY_B64" | base64 --decode > /tmp/AuthKey.p8
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA"
          app-store-connect publish \
            --path "$IPA" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "@file:/tmp/AuthKey.p8"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  android-google-play:
    name: Felcin Android - Google Play
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      groups:
        - android
      java: 21
      node: latest
      vars:
        PACKAGE_NAME: app.felcin.social
    scripts:
      - name: Write Google Play credentials
        script: |
          set -e

          # ── Step 1: resolve the raw JSON from whichever var is populated ──────
          RAW=""

          for VAR_NAME in GOOGLE_PLAY_SERVICE_ACCOUNT_JSON GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS; do
            VAR_VALUE="${!VAR_NAME}"
            if [ -z "$VAR_VALUE" ]; then
              echo "  [$VAR_NAME] is empty — skipping"
              continue
            fi
            echo "  [$VAR_NAME] is set (${#VAR_VALUE} chars)"

            # Detect base64: real JSON always starts with '{'; anything else is base64
            FIRST_CHAR="${VAR_VALUE:0:1}"
            if [ "$FIRST_CHAR" = "{" ]; then
              echo "  [$VAR_NAME] looks like raw JSON (starts with '{')"
              RAW="$VAR_VALUE"
            else
              echo "  [$VAR_NAME] does not start with '{' — attempting base64 decode"
              DECODED=$(echo "$VAR_VALUE" | base64 --decode 2>/dev/null) || true
              if [ "${DECODED:0:1}" = "{" ]; then
                echo "  [$VAR_NAME] base64 decode succeeded — using decoded value"
                RAW="$DECODED"
              else
                echo "  [$VAR_NAME] base64 decode did not produce JSON — skipping"
              fi
            fi

            [ -n "$RAW" ] && break
          done

          # ── Step 2: fail loudly if nothing resolved ──────────────────────────
          if [ -z "$RAW" ]; then
            echo "FATAL: Could not resolve valid JSON from GOOGLE_PLAY_SERVICE_ACCOUNT_JSON or GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS"
            echo "  Both variables are either empty or do not contain valid JSON (raw or base64)."
            echo "  Check the 'android' environment group in Codemagic settings."
            exit 1
          fi

          # ── Step 3: write the file ────────────────────────────────────────────
          echo "$RAW" > /tmp/gp-credentials.json
          FILE_SIZE=$(wc -c < /tmp/gp-credentials.json)
          echo "Credentials file written: $FILE_SIZE bytes"

          # ── Step 4: validate JSON and print key fields ────────────────────────
          if command -v python3 &>/dev/null; then
            python3 - <<'PYEOF'
          import json, sys
          try:
              with open('/tmp/gp-credentials.json') as f:
                  data = json.load(f)
              print(f"  JSON is valid")
              print(f"  type:         {data.get('type', '(missing)')}")
              print(f"  project_id:   {data.get('project_id', '(missing)')}")
              print(f"  client_email: {data.get('client_email', '(missing)')}")
              if data.get('type') != 'service_account':
                  print("  WARNING: 'type' is not 'service_account' — this credential will be rejected by Google Play")
              if '(missing)' in (data.get('client_email','(missing)'), data.get('project_id','(missing)')):
                  print("  WARNING: key fields are missing — credential file may be corrupt or wrong format")
          except json.JSONDecodeError as e:
              print(f"  FATAL: /tmp/gp-credentials.json is not valid JSON: {e}")
              sys.exit(1)
          PYEOF
          else
            echo "  python3 not available — skipping JSON validation (file was written)"
          fi

      - name: Build felcin-next static web bundle
        script: |
          set -e
          echo "=== Cloning felcin-next ==="
          git clone https://github.com/jjfitnessline23-dev/felcin-next.git /tmp/felcin-next
          cd /tmp/felcin-next

          echo "=== Installing dependencies ==="
          npm install --legacy-peer-deps

          echo "=== Patching felcin-next for static export ==="
          python3 << 'PYEOF'
          import os
          for root, dirs, files in os.walk('app/api'):
              for f in files:
                  if f == 'route.ts':
                      p = os.path.join(root, f)
                      c = open(p).read()
                      nc = c.replace("'force-dynamic'", "'force-static'").replace('"force-dynamic"', '"force-static"')
                      if nc != c:
                          open(p, 'w').write(nc)
                          print('  API patched: ' + p)
          dynamic_routes = [
              ('app/(protected)/challenges/[id]/page.tsx', 'id'),
              ('app/(protected)/ghost/[id]/page.tsx', 'id'),
              ('app/(protected)/live/[id]/page.tsx', 'id'),
              ('app/(protected)/podcasts/[id]/page.tsx', 'id'),
              ('app/(protected)/podcasts/live/[id]/page.tsx', 'id'),
              ('app/(protected)/subscribe/[uid]/page.tsx', 'uid'),
              ('app/(protected)/tag/[name]/page.tsx', 'name'),
              ('app/(protected)/trainers/[uid]/page.tsx', 'uid'),
              ('app/(protected)/training-sessions/[sessionId]/page.tsx', 'sessionId'),
          ]
          for path, key in dynamic_routes:
              if os.path.isfile(path):
                  c = ('import { Suspense } from "react";\nimport PageClient from "./PageClient";\n\n'
                       'export function generateStaticParams() { return [{ ' + key + ': "_" }]; }\n'
                       'export const dynamicParams = false;\n\n'
                       'export default function Page() { return <Suspense fallback={null}><PageClient /></Suspense>; }\n')
                  open(path, 'w').write(c)
                  print('  Patched: ' + path)
              else:
                  print('  Skipped: ' + path)
          sp = [
              'app/(protected)/advertise/page.tsx',
              'app/(protected)/badges/page.tsx',
              'app/(protected)/comments/page.tsx',
              'app/(protected)/creator/page.tsx',
              'app/(protected)/earnings/page.tsx',
              'app/(protected)/explore/page.tsx',
              'app/(protected)/page.tsx',
              'app/(protected)/private-chats/page.tsx',
              'app/(protected)/training-sessions/page.tsx',
          ]
          w = ('import { Suspense } from "react";\nimport PageContent from "./page.content";\n'
               'export default function Page() { return <Suspense fallback={null}><PageContent /></Suspense>; }\n')
          for page in sp:
              if os.path.isfile(page):
                  cp = os.path.join(os.path.dirname(page), 'page.content.tsx')
                  os.rename(page, cp)
                  open(page, 'w').write(w)
                  print('  Wrapped: ' + page)
              else:
                  print('  Skipped: ' + page)
          print('All patches applied.')
          PYEOF

          echo "=== Building static export ==="
          NEXT_PUBLIC_CAPACITOR_BUILD=true \
          NEXT_PUBLIC_API_URL="https://www.felcin.com" \
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_test_51TeacHFq0Nd4lLkFwHZ7nutFk0jI0H4bmtffnaI92is7ym5KEVuXmppnVMgQhC9qP39zBhgzOukNYUE4yvtiwa0I00CycqtIbo}" \
          npm run build

          if [ ! -f "out/index.html" ]; then
            echo "ERROR: out/index.html not found — static build failed"
            ls -la out/ 2>/dev/null || echo "out/ directory does not exist"
            exit 1
          fi

          echo "=== Static bundle ready at /tmp/felcin-next/out ==="
          ls /tmp/felcin-next/out/ | head -10

      - name: Patch capacitor.config.json for bundled mode
        script: |
          python3 << 'PYEOF'
          import json
          with open('capacitor.config.json', 'r') as f:
              config = json.load(f)
          config['webDir'] = '/tmp/felcin-next/out'
          config['server'] = {
              'hostname': 'www.felcin.com',
              'androidScheme': 'https'
          }
          with open('capacitor.config.json', 'w') as f:
              json.dump(config, f, indent=2)
          print('capacitor.config.json patched:')
          print(f"  webDir: {config['webDir']}")
          print(f"  server: {json.dumps(config['server'])}")
          PYEOF

      - name: Install npm dependencies
        script: npm install --legacy-peer-deps

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Patch GoogleAuthProviderHandler to clear cached account on sign-out
        script: |
          FILE="node_modules/@capacitor-firebase/authentication/android/src/main/java/io/capawesome/capacitorjs/plugins/firebase/authentication/handlers/GoogleAuthProviderHandler.java"
          perl -i -pe 's/public void signOut\(\) \{/public void signOut() {\n        if (mGoogleSignInClient != null) { mGoogleSignInClient.signOut(); }/' "$FILE"
          echo "Patch applied — signOut() now clears native Google Sign-In cache"

      - name: Add Android platform
        script: |
          if [ ! -f "android/gradlew" ]; then
            echo "gradlew missing — regenerating android platform"
            [ -f "android/app/build.gradle" ] && cp android/app/build.gradle /tmp/custom-build.gradle
            rm -rf android
            npx cap add android
            [ -f "/tmp/custom-build.gradle" ] && cp /tmp/custom-build.gradle android/app/build.gradle
            echo "Android platform regenerated"
          else
            echo "android/gradlew exists — skipping cap add"
          fi

      - name: Capacitor sync
        script: npx cap sync android

      - name: Set app name and version
        script: |
          BUILD_NO=$(( ${BUILD_NUMBER:-1} + 200 ))
          sed -i '' "s/versionCode [0-9]*/versionCode $BUILD_NO/" android/app/build.gradle
          sed -i '' "s/versionName \"[^\"]*\"/versionName \"2.0\"/" android/app/build.gradle
          echo "versionCode=$BUILD_NO versionName=2.0"

      - name: Replace app icon with Felcin ghost logo
        script: |
          ICON_SRC="android-icons"
          if [ -d "$ICON_SRC" ]; then
            cp "$ICON_SRC"/mipmap-mdpi/*.png    android/app/src/main/res/mipmap-mdpi/
            cp "$ICON_SRC"/mipmap-hdpi/*.png    android/app/src/main/res/mipmap-hdpi/
            cp "$ICON_SRC"/mipmap-xhdpi/*.png   android/app/src/main/res/mipmap-xhdpi/
            cp "$ICON_SRC"/mipmap-xxhdpi/*.png  android/app/src/main/res/mipmap-xxhdpi/
            cp "$ICON_SRC"/mipmap-xxxhdpi/*.png android/app/src/main/res/mipmap-xxxhdpi/
            echo "Icons installed from android-icons folder"
          else
            echo "No android-icons folder found — using icons already in android project"
          fi

      - name: Print signing fingerprint for assetlinks.json
        script: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/felcin-release.keystore
          echo "=== Full keytool output (for debugging) ==="
          keytool -list -v \
            -keystore /tmp/felcin-release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" 2>&1 || true
          echo "=== SHA256 fingerprint (paste into assetlinks.json) ==="
          keytool -list -v \
            -keystore /tmp/felcin-release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" 2>&1 | grep "SHA256:" || echo "WARNING: SHA256 not found — check KEYSTORE_BASE64 / KEY_ALIAS / KEYSTORE_PASSWORD env vars"

      - name: Build release AAB
        script: |
          echo "=== android/ contents before cd ==="
          ls -la android/ || echo "android/ directory missing!"
          cd android
          echo "=== inside android/ ==="
          ls -la
          chmod +x gradlew
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/felcin-release.keystore
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/felcin-release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Publish to Google Play
        script: |
          set -e
          echo "=== Installing Google API client ==="
          pip3 install --quiet google-auth google-api-python-client

          python3 - <<'PYEOF'
          import json, sys

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          PACKAGE   = 'app.felcin.social'
          AAB       = 'android/app/build/outputs/bundle/release/app-release.aab'
          CREDS     = '/tmp/gp-credentials.json'
          TRACK     = 'production'

          print(f'Loading credentials from {CREDS}...')
          creds = service_account.Credentials.from_service_account_file(
              CREDS,
              scopes=['https://www.googleapis.com/auth/androidpublisher']
          )
          print(f'Service account: {creds.service_account_email}')

          service = build('androidpublisher', 'v3', credentials=creds)

          print(f'Creating edit for {PACKAGE}...')
          edit = service.edits().insert(packageName=PACKAGE, body={}).execute()
          edit_id = edit['id']
          print(f'Edit ID: {edit_id}')

          print(f'Uploading {AAB}...')
          media = MediaFileUpload(AAB, mimetype='application/octet-stream', resumable=True)
          bundle = service.edits().bundles().upload(
              packageName=PACKAGE,
              editId=edit_id,
              media_body=media
          ).execute()
          version_code = bundle['versionCode']
          print(f'Uploaded AAB — versionCode: {version_code}')

          print(f'Assigning to {TRACK} track...')
          service.edits().tracks().update(
              packageName=PACKAGE,
              editId=edit_id,
              track=TRACK,
              body={'releases': [{'versionCodes': [version_code], 'status': 'completed'}]}
          ).execute()

          print('Committing edit...')
          service.edits().commit(packageName=PACKAGE, editId=edit_id).execute()
          print(f'SUCCESS: Published versionCode {version_code} to {TRACK} track!')
          PYEOF

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
