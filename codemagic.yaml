workflows:
  ios-app-store:
    name: Felcin iOS — App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - ios
      xcode: latest
      node: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.felcin.app
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Add iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Create certificate and profile
        script: |
          app-store-connect create-certificate \
            --type IOS_DISTRIBUTION \
            --save
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --save
          keychain add-certificates
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set -e

          PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" 2>/dev/null | head -1)
          if [ -z "$PROFILE_PATH" ]; then
            echo "No provisioning profile found"
            ls -la ~/Library/MobileDevice/ 2>/dev/null || true
            exit 1
          fi
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | /usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin)
          echo "Using profile UUID: $PROFILE_UUID"

          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath /tmp/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            DEVELOPMENT_TEAM=UWSVWR4VTX

          /usr/libexec/PlistBuddy \
            -c "Add :method string app-store" \
            -c "Add :teamID string UWSVWR4VTX" \
            -c "Add :signingStyle string manual" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:com.felcin.app string $PROFILE_UUID" \
            /tmp/ExportOptions.plist

          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath /tmp/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
