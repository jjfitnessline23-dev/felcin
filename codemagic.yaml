workflows:
  ios-app-store:
    name: Felcin iOS — App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - ios
      xcode: latest
      node: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.felcin.app
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Add iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set up signing
        script: |
          echo "=== Checking env vars ==="
          echo "DIST_CERT_P12 length: ${#DIST_CERT_P12}"
          echo "PROVISIONING_PROFILE length: ${#PROVISIONING_PROFILE}"
          echo "DIST_CERT_PASSWORD length: ${#DIST_CERT_PASSWORD}"

          echo "=== Decoding certificate ==="
          echo "$DIST_CERT_P12" | base64 --decode > /tmp/distribution.p12
          echo "p12 file size: $(wc -c < /tmp/distribution.p12) bytes"

          echo "=== Setting up keychain ==="
          KEYCHAIN_PATH=/tmp/app-signing.keychain-db
          KEYCHAIN_PASS=codemagic123
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import /tmp/distribution.p12 -k "$KEYCHAIN_PATH" \
            -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            ~/Library/Keychains/login.keychain-db
          echo "Keychain set up"

          echo "=== Installing provisioning profile ==="
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROVISIONING_PROFILE" | base64 --decode > /tmp/profile.mobileprovision
          echo "Profile file size: $(wc -c < /tmp/profile.mobileprovision) bytes"
          UUID=$(security cms -D -i /tmp/profile.mobileprovision 2>/dev/null \
            | grep -A1 "<key>UUID</key>" | grep "<string>" \
            | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          echo "Profile UUID: $UUID"
          cp /tmp/profile.mobileprovision "$PROFILE_DIR/$UUID.mobileprovision"
          echo "Profile installed"

          echo "=== Patching pbxproj ==="
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = \"[^\"]*\";/PROVISIONING_PROFILE_SPECIFIER = \"$UUID\";/g" "$PBXPROJ"
          echo "Patched"

          echo "=== Generating export options ==="
          cat > /Users/builder/export_options.plist << EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>method</key>
    <string>app-store</string>
    <key>teamID</key>
    <string>UWSVWR4VTX</string>
    <key>provisioningProfiles</key>
    <dict>
        <key>com.felcin.app</key>
        <string>$UUID</string>
    </dict>
</dict>
</plist>
EOF
          echo "Done"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
