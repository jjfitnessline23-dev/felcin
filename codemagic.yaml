workflows:
  ios-app-store:
    name: Felcin iOS — App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - ios
      xcode: latest
      node: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.felcin.app
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Add iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set up signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          echo "=== p12 files ==="
          find ~ -name "*.p12" 2>/dev/null | head -20
          echo "=== cer files ==="
          find ~ -name "*.cer" 2>/dev/null | head -20
          echo "=== mobileprovision files ==="
          find ~ -name "*.mobileprovision" 2>/dev/null | head -20

          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          # Find the provisioning profile installed by xcode-project use-profiles
          PROFILE=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" 2>/dev/null | head -1)
          if [ -z "$PROFILE" ]; then
            PROFILE=$(find ~ -name "*.mobileprovision" 2>/dev/null | head -1)
          fi

          if [ -n "$PROFILE" ]; then
            echo "Found profile: $PROFILE"
            UUID=$(security cms -D -i "$PROFILE" 2>/dev/null | grep -A1 "<key>UUID</key>" | grep "<string>" | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
            echo "Profile UUID: $UUID"
            PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
            sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = \"[^\"]*\";/PROVISIONING_PROFILE_SPECIFIER = \"$UUID\";/g" "$PBXPROJ"
            echo "Patched pbxproj with profile UUID"
          else
            echo "ERROR: No provisioning profile found — cannot build"
            exit 1
          fi

          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
