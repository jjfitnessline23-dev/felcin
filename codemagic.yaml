workflows:
  ios-app-store:
    name: Felcin iOS — App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - ios
      xcode: latest
      node: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.felcin.app
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Add iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set up signing
        script: |
          # Install certificate from base64 env var
          echo "$DIST_CERT_P12" | base64 -d > /tmp/distribution.p12
          security import /tmp/distribution.p12 -k ~/Library/Keychains/login.keychain-db \
            -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "" ~/Library/Keychains/login.keychain-db

          # Install provisioning profile from base64 env var
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROVISIONING_PROFILE" | base64 -d > /tmp/profile.mobileprovision
          UUID=$(security cms -D -i /tmp/profile.mobileprovision 2>/dev/null \
            | grep -A1 "<key>UUID</key>" | grep "<string>" \
            | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          echo "Profile UUID: $UUID"
          cp /tmp/profile.mobileprovision "$PROFILE_DIR/$UUID.mobileprovision"
          echo "Profile installed to $PROFILE_DIR/$UUID.mobileprovision"

          # Patch pbxproj with the profile UUID
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = \"[^\"]*\";/PROVISIONING_PROFILE_SPECIFIER = \"$UUID\";/g" "$PBXPROJ"
          echo "Patched pbxproj"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
